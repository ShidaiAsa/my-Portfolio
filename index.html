<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Tiny desk of Shidai Asakawa</title>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kurenaido&display=swap" rel="stylesheet">
<style>
:root{--mint:#eafcf9;--cream:#FFFBF5;--coral:#FF6F59;--ink:#223142;--ink-soft:#5B6B7C;}
*{box-sizing:border-box;}
html,body{margin:0;height:100%;}
body{background:var(--mint);color:var(--ink);font-family:"Zen Kurenaido","Hiragino Sans","Yu Gothic",sans-serif;display:flex;align-items:center;justify-content:center;padding:24px;}
.gate{width:100%;max-width:380px;background:var(--cream);border:2px solid var(--ink);border-radius:14px;box-shadow:5px 5px 0 var(--ink);padding:30px 26px 26px;text-align:center;transform:rotate(-0.6deg);}
.lock{font-size:30px;line-height:1;margin-bottom:10px;}
h1{margin:0;font-size:22px;font-weight:600;letter-spacing:.3px;}
p{margin:10px 0 20px;font-size:13.5px;color:var(--ink-soft);}
input{width:100%;padding:11px 13px;font:inherit;font-size:16px;text-align:center;border:2px solid var(--ink);border-radius:9px;background:#fff;color:var(--ink);outline:none;}
input:focus{border-color:var(--coral);}
button{margin-top:14px;width:100%;padding:11px;font:inherit;font-size:16px;font-weight:700;color:#fff;background:var(--ink);border:2px solid var(--ink);border-radius:9px;cursor:pointer;box-shadow:3px 3px 0 var(--coral);}
button:disabled{opacity:.55;cursor:default;}
.err{min-height:1.4em;margin-top:12px;font-size:13px;color:#c0392b;}
.shake{animation:shake .35s;}
@keyframes shake{20%{transform:translateX(-7px) rotate(-0.6deg);}40%{transform:translateX(6px) rotate(-0.6deg);}60%{transform:translateX(-4px) rotate(-0.6deg);}80%{transform:translateX(3px) rotate(-0.6deg);}}
</style>
</head>
<body>
<form class="gate" id="gate" autocomplete="off">
  <div class="lock">🔒</div>
  <h1>Tiny desk of Shidai Asakawa</h1>
  <p>このページはパスワードで保護されています</p>
  <input type="password" id="pw" placeholder="パスワード" autocomplete="current-password" autofocus>
  <button type="submit" id="btn">開く</button>
  <div class="err" id="err" role="alert"></div>
</form>
