<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Tiny desk of Shidai Asakawa</title>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kurenaido&display=swap" rel="stylesheet">
<style>
:root{--mint:#eafcf9;--cream:#FFFBF5;--coral:#FF6F59;--ink:#223142;--ink-soft:#5B6B7C;}
*{box-sizing:border-box;}
html,body{margin:0;height:100%;}
body{background:#05070a;color:var(--ink);font-family:"Zen Kurenaido","Hiragino Sans","Yu Gothic",sans-serif;overflow:hidden;}
#stage{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;}

#hint{position:fixed;top:22px;left:0;right:0;z-index:4;text-align:center;padding:0 16px;pointer-events:none;
  font-size:clamp(14px,2.3vw,19px);letter-spacing:.06em;color:rgba(255,246,220,.9);
  text-shadow:0 1px 4px rgba(0,0,0,.8);opacity:0;transition:opacity .6s ease;}
#skip{position:fixed;right:18px;bottom:18px;z-index:6;padding:7px 14px;font:inherit;font-size:13px;color:#fff;
  background:rgba(255,255,255,.1);border:1.5px solid rgba(255,255,255,.5);border-radius:100px;cursor:pointer;
  transition:opacity .4s ease,background .15s ease;}
#skip:hover{background:var(--coral);border-color:var(--coral);}
#skip.hide{opacity:0;pointer-events:none;}
#veil{position:fixed;inset:0;z-index:20;background:#000;opacity:1;pointer-events:none;transition:opacity 1.2s ease;}

/* プレイヤーの上に出る吹き出し。#anchor をプレイヤーの画面上の位置に合わせて動かす */
#anchor{position:fixed;left:0;top:0;width:0;height:0;z-index:5;pointer-events:none;}
.gate{position:absolute;left:0;bottom:18px;width:min(330px,90vw);padding:22px 20px 18px;text-align:center;
  background:var(--cream);border:2px solid var(--ink);border-radius:14px;box-shadow:5px 5px 0 var(--ink);
  visibility:hidden;opacity:0;pointer-events:none;transform:translateX(-50%) scale(.85);transform-origin:50% 100%;
  transition:opacity .35s ease,transform .45s cubic-bezier(.2,1.3,.4,1);}
.gate.show{visibility:visible;opacity:1;pointer-events:auto;transform:translateX(-50%) scale(1);}
.gate::before,.gate::after{content:"";position:absolute;left:calc(50% + var(--tail,0px));transform:translateX(-50%);
  border-style:solid;border-color:transparent;}
.gate::before{top:100%;border-width:17px 15px 0;border-top-color:var(--ink);}
.gate::after{top:calc(100% - 2px);border-width:15px 12px 0;border-top-color:var(--cream);}
.lock{font-size:26px;line-height:1;margin-bottom:8px;}
.gate h1{margin:0;font-size:20px;font-weight:600;letter-spacing:.3px;}
.gate p{margin:8px 0 16px;font-size:13px;color:var(--ink-soft);}
.gate input{width:100%;padding:10px 12px;font:inherit;font-size:16px;text-align:center;border:2px solid var(--ink);
  border-radius:9px;background:#fff;color:var(--ink);outline:none;}
.gate input:focus{border-color:var(--coral);}
.gate button{margin-top:12px;width:100%;padding:10px;font:inherit;font-size:16px;font-weight:700;color:#fff;
  background:var(--ink);border:2px solid var(--ink);border-radius:9px;cursor:pointer;box-shadow:3px 3px 0 var(--coral);}
.gate button:disabled{opacity:.55;cursor:default;}
.err{min-height:1.4em;margin-top:10px;font-size:13px;color:#c0392b;}
.shake{animation:shake .35s;}
@keyframes shake{
  20%{transform:translateX(calc(-50% - 7px)) scale(1);}
  40%{transform:translateX(calc(-50% + 6px)) scale(1);}
  60%{transform:translateX(calc(-50% - 4px)) scale(1);}
  80%{transform:translateX(calc(-50% + 3px)) scale(1);}
}

/* 3Dが使えない環境用の、従来どおりの入力カード */
body.plain{background:var(--mint);display:flex;align-items:center;justify-content:center;padding:24px;overflow:auto;}
body.plain #stage,body.plain #hint,body.plain #skip,body.plain #veil{display:none;}
body.plain #anchor{position:static;width:100%;height:auto;display:flex;justify-content:center;}
body.plain .gate{position:relative;left:auto;bottom:auto;visibility:visible;opacity:1;pointer-events:auto;
  transform:rotate(-0.6deg);max-width:380px;}
body.plain .gate::before,body.plain .gate::after{display:none;}
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div id="hint"></div>
<button id="skip" type="button">スキップ ⏭</button>
<div id="anchor">
  <form class="gate" id="gate" autocomplete="off">
    <div class="lock">🔒</div>
    <h1>Tiny desk of Shidai Asakawa</h1>
    <p>このページはパスワードで保護されています</p>
    <input type="password" id="pw" placeholder="パスワード" autocomplete="current-password">
    <button type="submit" id="btn">開く</button>
    <div class="err" id="err" role="alert"></div>
  </form>
</div>
<div id="veil"></div>

  var form = document.getElementById("gate");
  var pw = document.getElementById("pw");
  var btn = document.getElementById("btn");
  var err = document.getElementById("err");
  var veil = document.getElementById("veil");
  var sceneActive = false;
  var stopScene = function(){};

  function fromB64(s){ var b = atob(s), a = new Uint8Array(b.length); for (var i = 0; i < b.length; i++) a[i] = b.charCodeAt(i); return a; }
  function sleep(ms){ return new Promise(function(r){ setTimeout(r, ms); }); }
  function fail(msg){ err.textContent = msg; form.classList.remove("shake"); void form.offsetWidth; form.classList.add("shake"); }

  if (!window.crypto || !window.crypto.subtle) {
    err.textContent = "このブラウザ/接続ではページを開けません。https:// のURLから開き直してください。";
    btn.disabled = true; pw.disabled = true;
  }

  form.addEventListener("submit", async function(e){
    e.preventDefault();
    if (!pw.value) return;
    btn.disabled = true; btn.textContent = "確認中…"; err.textContent = "";
    var html;
    try {
      var enc = new TextEncoder();
      var mat = await crypto.subtle.importKey("raw", enc.encode(pw.value.normalize("NFKC")), "PBKDF2", false, ["deriveKey"]);
      var key = await crypto.subtle.deriveKey({ name:"PBKDF2", salt:fromB64(P.salt), iterations:P.iter, hash:"SHA-256" }, mat, { name:"AES-GCM", length:256 }, false, ["decrypt"]);
      var plain = await crypto.subtle.decrypt({ name:"AES-GCM", iv:fromB64(P.iv) }, key, fromB64(P.ct));
      html = new TextDecoder().decode(plain);
    } catch (ex) {
      fail("パスワードが違います");
      btn.disabled = false; btn.textContent = "開く"; pw.select();
      return;
    }
    if (sceneActive) {
      veil.style.transition = "opacity .4s ease"; veil.style.opacity = "1";
      await sleep(420);
    }
    stopScene(); /* 3Dの描画ループを止めてから、中身のページに入れ替える */
    document.open(); document.write(html); document.close();
  });

  /* ================= 3D演出 ================= */
  function initScene(){
    if (!window.THREE) throw new Error("three.js not loaded");

    var canvas = document.getElementById("stage");
    var hintEl = document.getElementById("hint");
    var skipBtn = document.getElementById("skip");
    var anchor = document.getElementById("anchor");

    var renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.setSize(window.innerWidth, window.innerHeight, false);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.setClearColor(0x05070a, 1);

    var scene = new THREE.Scene();
    var camera = new THREE.PerspectiveCamera(35, window.innerWidth / window.innerHeight, 0.1, 100);
    var look = new THREE.Vector3();

    /* ---- 寸法・設定(モデルを差し替えるときはここを見直す) ---- */
    var TW = 1.03, TH = 0.14, TD = 0.57;       /* ビデオテープ 幅・厚み・奥行き */
    var PW = 1.9, PH = 0.5, PD = 1.2;          /* プレイヤー 幅・高さ・奥行き */
    var SLOT_X = -PW * 0.12;                   /* スロットの位置(プレイヤー中心からのX) */
    var SLOT_Y = PH * 0.52;                    /* スロットの高さ */
    var LIFT = 0.62;                           /* ドラッグ中にテープを持ち上げる高さ */
    var BOUNDS = { xMin:-2.8, xMax:2.4, zMin:-1.8, zMax:2.0 }; /* ドラッグできる範囲(スポットライトの内側) */
    var MODEL_TAPE = "models/videotape.glb";
    var MODEL_PLAYER = "models/videoplayer.glb";
    var HINT_FIRST = "ビデオテープをつかんで、プレイヤーに入れよう";

    /* ---- 照明: ほぼ真っ暗 + スポットライト ---- */
    scene.add(new THREE.AmbientLight(0x8fa3c4, 0.07));
    var spot = new THREE.SpotLight(0xfff1d6, 1.9, 40, 0.36, 0.75, 1);
    spot.position.set(0.2, 7, 3.2);
    spot.castShadow = true;
    spot.shadow.mapSize.set(1024, 1024);
    spot.shadow.camera.near = 2; spot.shadow.camera.far = 20;
    spot.shadow.bias = -0.0004;
    var spotTarget = new THREE.Object3D();
    spotTarget.position.set(-0.3, 0, 0.2);
    scene.add(spotTarget);
    spot.target = spotTarget;
    scene.add(spot);

    var floor = new THREE.Mesh(new THREE.PlaneGeometry(60, 60), new THREE.MeshStandardMaterial({ color:0x2b2f36, roughness:0.95 }));
    floor.rotation.x = -Math.PI / 2;
    floor.receiveShadow = true;
    scene.add(floor);

    /* ---- 素材 ---- */
    function mat(c, o){ return new THREE.MeshStandardMaterial(Object.assign({ color:c, roughness:0.6, metalness:0.1 }, o || {})); }
    function box(w, h, d, m){ var me = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), m); me.castShadow = true; me.receiveShadow = true; return me; }
    function cyl(r, h, m, seg){ var me = new THREE.Mesh(new THREE.CylinderGeometry(r, r, h, seg || 16), m); me.castShadow = true; me.receiveShadow = true; return me; }
    var M = {
      tapeBody: mat(0x24262c, { roughness:0.5 }),
      tapeFlap: mat(0x3a3d45),
      label:    mat(0xFFFBF5, { emissive:0xFF6F59, emissiveIntensity:0 }),
      coral:    mat(0xFF6F59),
      window:   mat(0x08080a),
      hub:      mat(0xe8e8e8),
      pBody:    mat(0x2b2e35, { metalness:0.3, roughness:0.5 }),
      pTop:     mat(0x353941, { metalness:0.3, roughness:0.5 }),
      pPanel:   mat(0x1d1f24),
      pFrame:   mat(0x3a3e46),
      slot:     mat(0x050506, { roughness:0.9, emissive:0xFF6F59, emissiveIntensity:0 }),
      disp:     mat(0x0b1d14, { emissive:0x39ff88, emissiveIntensity:0.5 }),
      btn:      mat(0x7b818c),
      led:      mat(0x440000, { emissive:0xff2a2a, emissiveIntensity:0.9 })
    };

    /* ---- 仮モデル: ビデオテープ(平置き。奥行き方向 -Z 側がプレイヤーに入る側) ---- */
    function buildTapeModel(){
      var g = new THREE.Group();
      var body = box(TW, TH, TD, M.tapeBody); body.position.y = TH / 2; g.add(body);
      var flap = box(TW * 0.96, TH * 0.5, 0.02, M.tapeFlap); flap.position.set(0, TH * 0.5, -TD / 2 - 0.004); g.add(flap);
      var label = box(TW * 0.78, 0.006, TD * 0.38, M.label); label.position.set(0, TH + 0.002, -TD * 0.12); g.add(label);
      var stripe = box(TW * 0.78, 0.007, 0.05, M.coral); stripe.position.set(0, TH + 0.003, -TD * 0.24); g.add(stripe);
      var win = box(TW * 0.6, 0.006, TD * 0.24, M.window); win.position.set(0, TH + 0.002, TD * 0.26); g.add(win);
      [-1, 1].forEach(function(s){
        var hub = cyl(0.05, 0.008, M.hub, 16); hub.position.set(s * TW * 0.17, TH + 0.004, TD * 0.26); g.add(hub);
      });
      return g;
    }

    /* ---- 仮モデル: ビデオプレイヤー(正面が +Z。正面にスロットがある) ---- */
    function buildPlayerModel(){
      var g = new THREE.Group();
      var body = box(PW, PH, PD, M.pBody); body.position.y = PH / 2; g.add(body);
      var top = box(PW * 0.985, 0.02, PD * 0.985, M.pTop); top.position.y = PH + 0.008; g.add(top);
      var panel = box(PW * 0.97, PH * 0.8, 0.006, M.pPanel); panel.position.set(0, PH * 0.5, PD / 2 + 0.003); g.add(panel);
      var frame = box(PW * 0.64, 0.22, 0.006, M.pFrame); frame.position.set(SLOT_X, SLOT_Y, PD / 2 + 0.008); g.add(frame);
      var slot = box(PW * 0.6, 0.17, 0.006, M.slot); slot.position.set(SLOT_X, SLOT_Y, PD / 2 + 0.012); g.add(slot);
      var disp = box(0.36, 0.1, 0.006, M.disp); disp.position.set(PW * 0.33, SLOT_Y + 0.04, PD / 2 + 0.008); g.add(disp);
      for (var i = 0; i < 3; i++) {
        var b = cyl(0.035, 0.02, M.btn, 12);
        b.rotation.x = Math.PI / 2;
        b.position.set(PW * 0.22 + i * 0.14, 0.1, PD / 2 + 0.012);
        g.add(b);
      }
      var led = new THREE.Mesh(new THREE.SphereGeometry(0.018, 10, 8), M.led);
      led.position.set(PW * 0.43, 0.1, PD / 2 + 0.014); g.add(led);
      return g;
    }

    /* ---- オブジェクト配置 ---- */
    var tape = new THREE.Group();
    var tapeVisual = new THREE.Group();
    tapeVisual.add(buildTapeModel());
    tape.add(tapeVisual);
    var tapeHit = new THREE.Mesh(new THREE.BoxGeometry(TW * 1.15, 0.5, TD * 1.4),
      new THREE.MeshBasicMaterial({ transparent:true, opacity:0, depthWrite:false }));
    tapeHit.position.y = 0.2;
    tape.add(tapeHit);
    tape.position.set(-1.5, 0, 0.9);
    tape.rotation.y = 0.35;
    scene.add(tape);

    var player = new THREE.Group();
    var playerVisual = new THREE.Group();
    playerVisual.add(buildPlayerModel());
    player.add(playerVisual);
    player.position.set(1.0, 0, -0.6);
    scene.add(player);

    /* ---- .glb があれば仮モデルと入れ替える(無ければ仮モデルのまま) ---- */
    function loadModel(url, targetW, holder, done){
      if (!THREE.GLTFLoader) { done(); return; }
      new THREE.GLTFLoader().load(url, function(gltf){
        try {
          var m = gltf.scene;
          var b = new THREE.Box3().setFromObject(m);
          var size = new THREE.Vector3(); b.getSize(size);
          var ctr = new THREE.Vector3(); b.getCenter(ctr);
          m.traverse(function(n){ if (n.isMesh) { n.castShadow = true; n.receiveShadow = true; } });
          m.position.set(-ctr.x, -b.min.y, -ctr.z);
          var w = new THREE.Group(); w.add(m);
          w.scale.setScalar(targetW / (size.x || 1));
          while (holder.children.length) holder.remove(holder.children[0]);
          holder.add(w);
        } catch (ex) { console.warn("model swap failed", url, ex); }
        done();
      }, undefined, function(){ done(); });
    }

    /* ---- カメラの姿勢 ---- */
    var T35 = 2 * Math.tan(17.5 * Math.PI / 180);
    var OV_TARGET = new THREE.Vector3(-0.3, 0, 0.2);
    var OV_DIR = new THREE.Vector3(0, 7.2, 4.2).normalize();
    function aspect(){ return window.innerWidth / window.innerHeight; }
    function overviewPose(){
      var dist = Math.max(8.4, 6.0 / (T35 * aspect())); /* 縦長の画面では引いて全体を収める */
      return { pos: OV_TARGET.clone().addScaledVector(OV_DIR, dist), look: OV_TARGET.clone() };
    }
    function zoomPose(){
      var dist = Math.max(3.4, 3.1 / (T35 * aspect()));
      var px = player.position.x, pz = player.position.z;
      return { pos: new THREE.Vector3(px, 1.35, pz + dist), look: new THREE.Vector3(px, 0.7, pz) };
    }
    function spotZoomPos(){ return new THREE.Vector3(player.position.x + 0.6, 4.2, player.position.z + 2.6); }
    function spotZoomTarget(){ return new THREE.Vector3(player.position.x, 0.25, player.position.z); }

    var stage = 1; /* 1:ドラッグ待ち  2:挿入・ズーム中  3:パスワード入力 */
    (function(){ var o = overviewPose(); camera.position.copy(o.pos); look.copy(o.look); })();

    /* ---- 簡易トゥイーン ---- */
    var tweens = [];
    function tween(sec, fn, done){ tweens.push({ t0: performance.now(), dur: sec * 1000, fn: fn, done: done }); }
    function updateTweens(now){
      for (var i = tweens.length - 1; i >= 0; i--) {
        var tw = tweens[i];
        if (!tw) continue;
        var p = Math.min((now - tw.t0) / tw.dur, 1);
        tw.fn(p);
        if (p >= 1) { tweens.splice(tweens.indexOf(tw), 1); if (tw.done) tw.done(); }
      }
    }
    function ease(p){ return p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2; }
    function L(a, b, t){ return a + (b - a) * t; }
    function setHint(text){ hintEl.textContent = text; }

    /* ---- ドラッグ&ドロップ ---- */
    var raycaster = new THREE.Raycaster();
    var ndc = new THREE.Vector2();
    var floorPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
    var hitPt = new THREE.Vector3();
    var dragOff = new THREE.Vector3();
    var dragging = false;

    function setNDC(e){
      var r = canvas.getBoundingClientRect();
      ndc.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
      raycaster.setFromCamera(ndc, camera);
    }
    function isOverPlayer(){
      return Math.abs(tape.position.x - player.position.x) < (PW + TW) / 2 &&
             Math.abs(tape.position.z - player.position.z) < (PD + TD) / 2;
    }
    function clamp(v, a, b){ return Math.min(b, Math.max(a, v)); }

    canvas.addEventListener("pointerdown", function(e){
      if (stage !== 1 || !tape.visible) return;
      setNDC(e);
      if (!raycaster.intersectObject(tapeHit, false).length) return;
      e.preventDefault();
      dragging = true;
      try { canvas.setPointerCapture(e.pointerId); } catch (x) {}
      if (raycaster.ray.intersectPlane(floorPlane, hitPt)) dragOff.set(tape.position.x - hitPt.x, 0, tape.position.z - hitPt.z);
      else dragOff.set(0, 0, 0);
      canvas.style.cursor = "grabbing";
      setHint("ビデオテープをプレイヤーまで運ぼう");
    });
    canvas.addEventListener("pointermove", function(e){
      if (stage !== 1) return;
      setNDC(e);
      if (dragging) {
        if (raycaster.ray.intersectPlane(floorPlane, hitPt)) {
          tape.position.x = clamp(hitPt.x + dragOff.x, BOUNDS.xMin, BOUNDS.xMax);
          tape.position.z = clamp(hitPt.z + dragOff.z, BOUNDS.zMin, BOUNDS.zMax);
        }
      } else if (e.pointerType === "mouse") {
        canvas.style.cursor = raycaster.intersectObject(tapeHit, false).length ? "grab" : "default";
      }
    });
    function endDrag(e){
      if (!dragging) return;
      dragging = false;
      canvas.style.cursor = "default";
      try { canvas.releasePointerCapture(e.pointerId); } catch (x) {}
      if (isOverPlayer()) startInsert(); else setHint(HINT_FIRST);
    }
    canvas.addEventListener("pointerup", endDrag);
    canvas.addEventListener("pointercancel", endDrag);

    /* ---- 挿入 → ズーム → 吹き出し ---- */
    function startInsert(){
      stage = 2;
      hintEl.style.opacity = "0";
      skipBtn.classList.add("hide");
      var from = tape.position.clone(), fromRy = tape.rotation.y, fromTilt = tapeVisual.rotation.x;
      var sx = player.position.x + SLOT_X;
      var sy = SLOT_Y - TH / 2;
      var zStage = player.position.z + PD / 2 + TD / 2 + 0.35;
      var zEnd = player.position.z + PD / 2 - TD * 0.9;
      /* A: スロットの正面まで持ち上げて運ぶ */
      tween(0.5, function(p){
        var e = ease(p);
        tape.position.set(L(from.x, sx, e), L(from.y, sy, e) + Math.sin(p * Math.PI) * 0.3, L(from.z, zStage, e));
        tape.rotation.y = L(fromRy, 0, e);
        tapeVisual.rotation.x = L(fromTilt, 0, e);
      }, function(){
        tape.position.set(sx, sy, zStage);
        startZoom();
        /* B: スロットへ吸い込まれる(本体に隠れて見えなくなる) */
        tween(0.6, function(p){ tape.position.z = L(zStage, zEnd, p * p); }, function(){ tape.visible = false; });
      });
    }
    function startZoom(){
      var fromPos = camera.position.clone(), fromLook = look.clone();
      var sp0 = spot.position.clone(), st0 = spotTarget.position.clone();
      tween(1.8, function(p){
        var e = ease(p), z = zoomPose();
        camera.position.lerpVectors(fromPos, z.pos, e);
        look.lerpVectors(fromLook, z.look, e);
        spot.position.lerpVectors(sp0, spotZoomPos(), e);
        spotTarget.position.lerpVectors(st0, spotZoomTarget(), e);
        spot.angle = L(0.36, 0.55, e);
        spot.intensity = L(1.9, 2.4, e);
      }, showBubble);
    }
    function showBubble(){
      stage = 3;
      form.classList.add("show");
      setTimeout(function(){ try { pw.focus({ preventScroll:true }); } catch (x) {} }, 350);
    }
    skipBtn.addEventListener("click", function(){
      if (stage !== 1) return;
      stage = 2; dragging = false;
      hintEl.style.opacity = "0";
      skipBtn.classList.add("hide");
      tape.visible = false;
      startZoom();
    });

    /* ---- 吹き出しをプレイヤーの頭上に追従させる ---- */
    var proj = new THREE.Vector3();
    function positionBubble(){
      if (stage < 3) return;
      proj.set(player.position.x, PH + 0.02, player.position.z).project(camera);
      var sx = (proj.x * 0.5 + 0.5) * window.innerWidth;
      var sy = (-proj.y * 0.5 + 0.5) * window.innerHeight;
      var half = form.offsetWidth / 2 + 10;
      var cx = clamp(sx, half, window.innerWidth - half);
      var shift = cx - sx;
      var ay = Math.max(sy, form.offsetHeight + 40);
      anchor.style.left = sx + "px";
      anchor.style.top = ay + "px";
      form.style.left = shift + "px";
      form.style.setProperty("--tail", (-shift) + "px");
    }

    /* ---- 描画ループ ---- */
    var raf = 0, running = true, lastOver = false;
    function frame(){
      if (!running) return;
      raf = requestAnimationFrame(frame);
      updateTweens(performance.now());
      var t = performance.now() / 1000;
      if (stage === 1) {
        tape.position.y += ((dragging ? LIFT : 0) - tape.position.y) * 0.25;
        tapeVisual.rotation.x += ((dragging ? -0.2 : 0) - tapeVisual.rotation.x) * 0.2;
        M.label.emissiveIntensity = dragging ? 0.1 : 0.3 + 0.2 * Math.sin(t * 3.2); /* つかめることを知らせるゆるい点滅 */
        var over = dragging && isOverPlayer();
        if (over !== lastOver) {
          lastOver = over;
          if (dragging) setHint(over ? "ここで手を離すと入るよ" : "ビデオテープをプレイヤーまで運ぼう");
        }
      }
      var glow = stage === 2 ? 1.1 : (stage >= 3 ? 0.35 : (dragging && lastOver ? 1.1 : 0));
      M.slot.emissiveIntensity += (glow - M.slot.emissiveIntensity) * 0.2;
      camera.lookAt(look);
      positionBubble();
      renderer.render(scene, camera);
    }

    function onResize(){
      renderer.setSize(window.innerWidth, window.innerHeight, false);
      camera.aspect = aspect();
      camera.updateProjectionMatrix();
      if (stage === 1) { var o = overviewPose(); camera.position.copy(o.pos); look.copy(o.look); }
      else if (stage === 3) { var z = zoomPose(); camera.position.copy(z.pos); look.copy(z.look); }
    }
    window.addEventListener("resize", onResize);

    stopScene = function(){
      running = false;
      cancelAnimationFrame(raf);
      window.removeEventListener("resize", onResize);
      try { renderer.dispose(); renderer.forceContextLoss(); } catch (x) {}
    };
    sceneActive = true;
    setHint(HINT_FIRST);
    frame();

    /* モデルの読み込み(または2.5秒の待ち)が終わったら、暗転から明るくしてスタート */
    var pending = 2, settled = false;
    function settle(){
      if (settled) return;
      settled = true;
      veil.style.opacity = "0";
      hintEl.style.opacity = "1";
    }
    function oneDone(){ pending--; if (pending <= 0) settle(); }
    loadModel(MODEL_TAPE, TW, tapeVisual, oneDone);
    loadModel(MODEL_PLAYER, PW, playerVisual, oneDone);
    setTimeout(settle, 2500);
  }

  try {
    initScene();
  } catch (ex) {
    console.warn("3D演出を開始できなかったため、通常の入力画面を表示します", ex);
    document.body.classList.add("plain");
    form.classList.add("show");
    setTimeout(function(){ try { pw.focus(); } catch (x) {} }, 50);
  }
})();
</script>
</body>
</html>
