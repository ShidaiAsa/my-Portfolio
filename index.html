<script>
  (function() {
    // ーーー【重要】ここで大学の審査官用の共通パスワードを決めます ーーー
    const CORRECT_PASSWORD = "ここに好きなパスワード"; 

    // すでにログイン済みかクッキーを確認
    if (document.cookie.split('; ').find(row => row.startsWith('portfolio_auth='))) {
      return; // ログイン済みならそのままサイトを表示
    }

    // パスワードが合うまで、YouTubeや3Dモデルの読み込みを【完全に停止】してポップアップを出す
    let enteredPassword = "";
    while (enteredPassword !== CORRECT_PASSWORD) {
      enteredPassword = prompt("【個人情報保護】出願書類に記載の共通パスワードを入力してください：");
      
      // キャンセルされた場合や空欄の場合はページを真っ白にして完全にブロック
      if (enteredPassword === null || enteredPassword === "") {
        window.stop(); // ⚠️ YouTubeや3Dモデルの裏での読み込み・暴走を強制停止
        document.documentElement.innerHTML = "<body style='font-family:sans-serif; text-align:center; padding-top:100px; background:#fff; color:#000;'><h1>閲覧権限がありません</h1><p>出願書類に記載のパスワードを入力してください。再読み込み（リロード）すると再度入力できます。</p></body>";
        throw new Error("Password required");
      }
      
      if (enteredPassword !== CORRECT_PASSWORD) {
        alert("パスワードが違います。もう一度入力してください。");
      }
    }

    // パスワードが合っていたらクッキーに保存してサイトの読み込みを続行（24時間有効）
    document.cookie = "portfolio_auth=true; path=/; max-age=86400; Secure; SameSite=Strict";
  })();
</script>
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Tiny desk of Shidai Asakawa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kurenaido&display=swap" rel="stylesheet">
<style>
  :root{
    --mint:#eafcf9;
    --oak:#ce8c52;
    --oak-dark:#9C6B3F;
    --cream:#FFFBF5;
    --coral:#FF6F59;
    --ink:#223142;
    --ink-soft:#5B6B7C;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;overflow:hidden;background:var(--mint);font-family:'Inter',sans-serif;color:var(--ink);}
  #scene-container{position:fixed;inset:0;}
  canvas{display:block;touch-action:none;cursor:grab;}
  canvas.dragging{cursor:grabbing;}

  /* Tilt-shift miniature illusion */
  .tilt-shift{position:fixed;left:0;right:0;pointer-events:none;z-index:5;}
  .tilt-shift.top{top:0;height:22vh;background:linear-gradient(to bottom, rgba(220,239,230,0.55), rgba(220,239,230,0));backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);mask-image:linear-gradient(to bottom, black, transparent);-webkit-mask-image:linear-gradient(to bottom, black, transparent);}
  .tilt-shift.bottom{bottom:0;height:26vh;background:linear-gradient(to top, rgba(220,239,230,0.6), rgba(220,239,230,0));backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);mask-image:linear-gradient(to top, black, transparent);-webkit-mask-image:linear-gradient(to top, black, transparent);}

  /* Header */
  .hud{position:fixed;top:0;left:0;right:0;padding:22px 26px;z-index:10;pointer-events:none;display:flex;justify-content:space-between;align-items:flex-start;}
  .hud h1{font-family:'Zen Kurenaido',sans-serif;font-size:22px;font-weight:600;margin:0;color:var(--ink);letter-spacing:0.2px;}
  .hud p{margin:4px 0 0;font-size:13px;color:var(--ink-soft);font-family:'Zen Kurenaido',cursive;}
  .hint{position:relative;background:#FFE993;border:none;border-radius:2px 2px 8px 2px;padding:10px 16px 12px;font-size:14px;font-family:'Zen Kurenaido',cursive;color:#4A3B1E;box-shadow:2px 3px 6px rgba(34,49,66,0.25);opacity:1;transform:rotate(-2deg);transition:opacity .6s ease;pointer-events:none;}
  .hint::before{content:'';position:absolute;top:-9px;left:50%;transform:translateX(-50%) rotate(-4deg);width:46px;height:16px;background:rgba(255,111,89,0.55);border:1px solid rgba(255,111,89,0.7);}
  .hint.hide{opacity:0;}

  /* Tooltip near cursor */
  #tooltip{position:fixed;pointer-events:none;z-index:15;background:#FFF4B8;color:#4A3B1E;font-family:'Zen Kurenaido',cursive;font-size:15px;padding:6px 13px 8px;border-radius:2px 2px 6px 2px;transform:translate(-50%,-150%) rotate(-2deg);opacity:0;transition:opacity .12s ease;white-space:nowrap;box-shadow:2px 2px 5px rgba(34,49,66,0.3);}
  #tooltip.show{opacity:1;}

  /* Reset view button */
  #reset-btn{position:fixed;bottom:24px;right:24px;z-index:10;width:46px;height:46px;border-radius:50%;background:var(--cream);border:2px solid var(--ink);box-shadow:3px 3px 0 var(--ink);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:18px;transition:transform .15s ease;}
  #reset-btn:hover{transform:translateY(-2px);}
  #reset-btn:active{transform:translateY(1px);box-shadow:1px 1px 0 var(--ink);}

  /* タグで机の上を整理するボタン(画面端のUI)。
     アイコン画像は後から差し替え可能。#tag-filter-icon-img の src を
     用意した画像パスに変更してください(見つからない場合は絵文字のまま表示されます) */
  #tag-filter-btn{position:fixed;left:24px;bottom:24px;z-index:10;width:100px;height:100px;border-radius:50%;background:transparent;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:20px;overflow:hidden;padding:0;transition:transform .15s ease;}
  #tag-filter-btn:hover{transform:translateY(-2px);}
  #tag-filter-btn:active{transform:translateY(1px);}
  #tag-filter-btn img{width:100%;height:100%;object-fit:cover;border-radius:50%;display:block;}

  #tag-filter-menu{position:fixed;left:24px;bottom:88px;z-index:11;background:var(--cream);border:2px solid var(--ink);border-radius:14px;box-shadow:4px 4px 0 var(--ink);padding:16px;width:240px;max-width:70vw;max-height:50vh;overflow-y:auto;opacity:0;transform:translateY(10px) scale(0.95);pointer-events:none;transition:opacity .2s ease,transform .2s ease;}
  #tag-filter-menu.open{opacity:1;transform:translateY(0) scale(1);pointer-events:auto;}
  .tag-filter-menu-title{font-family:'Zen Kurenaido',cursive;font-size:12.5px;color:var(--ink-soft);margin-bottom:12px;}
  .tag-filter-menu-inner{display:flex;flex-wrap:wrap;gap:8px;}
  .tag-filter-chip{position:relative;font-family:'Zen Kurenaido',cursive;font-size:12.5px;padding:9px 14px 11px;border-radius:2px 2px 8px 2px;border:none;background:#fff;color:var(--ink);cursor:pointer;box-shadow:2px 3px 6px rgba(34,49,66,0.2);transition:transform .15s ease,box-shadow .15s ease;}
  .tag-filter-chip::before{content:'';position:absolute;top:-8px;left:50%;transform:translateX(-50%) rotate(-4deg);width:34px;height:12px;background:rgba(255,111,89,0.55);border:1px solid rgba(255,111,89,0.7);}
  .tag-filter-chip:nth-child(3n+2){background:rgba(255,89,72,0.22);transform:rotate(-2deg);}
  .tag-filter-chip:nth-child(3n+3){background:rgba(53,53,239,0.22);transform:rotate(1.5deg);}
  .tag-filter-chip:nth-child(3n+1){background:rgba(230,239,46,0.32);transform:rotate(-1deg);}
  .tag-filter-chip:hover{transform:translateY(-3px) rotate(0deg) !important;box-shadow:3px 6px 12px rgba(34,49,66,0.3);}
  .tag-filter-chip-all{background:var(--mint) !important;}
  .tag-filter-chip.active{background:var(--ink) !important;color:#fff;}
  .tag-filter-chip.active::before{background:rgba(255,209,102,0.75);border-color:rgba(255,209,102,0.9);}

  /* Detail panel */
  #panel-backdrop{position:fixed;inset:0;background:rgba(34,49,66,0.25);z-index:19;opacity:0;pointer-events:none;transition:opacity .25s ease;}
  #panel-backdrop.show{opacity:1;pointer-events:auto;}

  #panel{position:fixed;top:50%;left:50%;width:90vw;height:90vh;max-width:90vw;max-height:90vh;background:var(--cream);z-index:20;box-shadow:3px 4px 0 rgba(34,49,66,0.15), 6px 10px 18px rgba(34,49,66,0.22);border:none;border-radius:3px;transform:translate(-50%,-50%) rotate(-0.6deg) scale(0.94);opacity:0;pointer-events:none;transition:transform .3s cubic-bezier(.2,.9,.25,1), opacity .22s ease;overflow:hidden;display:flex;flex-direction:column;}
  #panel.open{transform:translate(-50%,-50%) rotate(-0.6deg) scale(1);opacity:1;pointer-events:auto;}
  #panel::before{content:'';position:absolute;top:-10px;left:36px;width:70px;height:26px;background:rgba(255,209,102,0.6);border:1px solid rgba(255,209,102,0.8);transform:rotate(-5deg);z-index:6;box-shadow:0 1px 2px rgba(34,49,66,0.15);}

  .panel-close{position:absolute;top:14px;right:14px;width:32px;height:32px;border-radius:50%;border:2px dashed var(--ink);background:var(--cream);color:var(--ink);font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:9;font-family:'Zen Kurenaido',cursive;}
  .panel-close:hover{background:var(--coral);border-color:var(--coral);color:#fff;}

  /* 裏返しページ: 左下の矢印ボタンをクリックすると、制作過程/動機のページに反転する
     ボタンは各面(表/裏)の子要素にして、回転と一緒に動くようにしている。

     Safari対策:
     1) perspective を #panel(overflow:hidden あり)ではなく、
        別要素の .panel-3d-stage に分離する
        (overflow:hidden と perspective が同じ要素にあると、
         Safariでは3D回転中にちらつくことがあるため)
     2) 静止している面(.panel-face)には will-change を付けない
        (回転していない要素に will-change を付けると、
         Safariでは backface-visibility が正しく効かず、
         非表示のはずの面が残って見えることがあるため)
     3) JS側でも face-inactive クラスにより visibility / pointer-events を
        明示的に切り替えて、非表示面のボタンがクリックできてしまうのを防ぐ */
  .panel-3d-stage{position:relative;flex:1;min-height:0;perspective:1800px;-webkit-perspective:1800px;}
  .panel-flip{position:absolute;inset:0;transform-style:preserve-3d;-webkit-transform-style:preserve-3d;transition:transform .8s cubic-bezier(.4,.2,.2,1);will-change:transform;}
  #panel.flipped .panel-flip{transform:rotateY(180deg);-webkit-transform:rotateY(180deg);}
  .panel-face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden;display:flex;flex-direction:column;}
  .panel-back{transform:rotateY(180deg);-webkit-transform:rotateY(180deg);}
  /* SafariはCSSのbackface-visibilityだけでは非表示面が残ることがあるため、
     JS側でも明示的にvisibilityを切り替えて確実に隠す(下のJSで .flip-arrow-btn クリック時に付け外し) */
  .panel-face.face-inactive{visibility:hidden;pointer-events:none;}

  .flip-arrow-btn{position:absolute;left:20px;bottom:18px;display:inline-flex;align-items:center;gap:8px;padding:8px 16px 8px 12px;background:var(--cream);border:2px dashed var(--ink);border-radius:100px;cursor:pointer;font-family:'Zen Kurenaido',cursive;font-size:12.5px;color:var(--ink-soft);box-shadow:2px 2px 0 rgba(34,49,66,0.15);z-index:5;transition:background .15s ease,color .15s ease,border-color .15s ease;}
  .flip-arrow-btn:hover{background:var(--coral);border-color:var(--coral);color:#fff;}
  .flip-arrow-icon{font-size:16px;line-height:1;}

  /* 回転中のちらつきを避けるため、中間地点での非表示はアニメーションさせず瞬時に切り替える */
  .panel-media-group.media-hidden{opacity:0;}

  .panel-body{position:relative;padding:30px 26px 24px 44px;overflow-y:auto;flex:1;
    background-color:var(--cream);
    background-image:repeating-linear-gradient(to bottom, transparent 0 30px, rgba(91,107,124,0.16) 30px 31px);
    background-position:0 6px;}
  .panel-body::before{content:'';position:absolute;top:0;bottom:0;left:32px;width:1px;background:rgba(255,111,89,0.4);}

  /* 裏面: 制作過程・動機を書くページ。クラフト紙っぽいトーンにして反転を分かりやすく */
  .panel-back .panel-body{
    background-color:#EFE6D0;
    background-image:repeating-linear-gradient(to bottom, transparent 0 30px, rgba(91,107,124,0.14) 30px 31px);
  }
  .panel-back .panel-body::before{background:rgba(90,169,230,0.4);}
  .process-heading{font-family:'Zen Kurenaido',cursive;font-size:13px;color:var(--ink-soft);letter-spacing:.04em;margin-bottom:2px;}
  .process-text{font-family:'Zen Kurenaido',cursive;font-size:16px;line-height:1.95;color:var(--ink);white-space:pre-wrap;}

  /* 文章内の簡易装飾: **太字** / ==色:マーカー== / __色:アンダーライン__ */
  .text-marker{background-color:#FFD166;mix-blend-mode:multiply;padding:0 3px;border-radius:2px;}
  .text-underline{text-decoration:underline;text-decoration-color:#FF6F59;text-decoration-thickness:2.5px;text-underline-offset:3px;}
  .process-back-title{margin-bottom:22px;}

  /* 2つの文章セクションを対角線状に配置し、余ったスペースに写真/映像を置く */
  .process-diagonal{display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:minmax(min-content,auto);column-gap:28px;row-gap:8px;}
  .process-section{padding:2px 4px;}
  .process-section-a{grid-column:1;grid-row:1;transform:rotate(-0.8deg);}
  .process-media-a{grid-column:2;grid-row:1;display:flex;flex-wrap:wrap;align-content:flex-start;justify-content:flex-end;gap:6px;}
  .process-section-b{grid-column:2;grid-row:2;text-align:left;margin-top:30px;transform:rotate(0.8deg);}
  .process-media-b{grid-column:1;grid-row:2;display:flex;flex-wrap:wrap;align-content:flex-end;justify-content:flex-start;gap:6px;margin-top:30px;}
  .process-media-a .panel-media,.process-media-b .panel-media{float:none;margin:0 0 14px;}

  /* 写真/映像を、貼り付けたポラロイドのように。
     増えたときは下に広がっていくよう、float ではなく flex-wrap で並べている */
  .panel-media-group{display:flex;flex-wrap:wrap;gap:18px;margin:0 0 20px;}
  .panel-media{width:220px;max-width:46%;margin:0;background:#fff;padding:10px 10px 32px;box-shadow:2px 4px 10px rgba(34,49,66,0.28);position:relative;}
  /* メイン(大)/サブ(小): projectsData の media で { url, size:'sub' } のように指定できる。省略時はメイン(大) */
  .panel-media.size-main{width:500px;max-width:58%;}
  .panel-media.size-sub{width:300px;max-width:34%;padding:7px 7px 22px;}
  .panel-media.size-sub .media-play-icon{width:36px;height:36px;font-size:13px;}
  /* 写真/映像の下の白い余白に入れる説明文(media の caption で指定) */
  .panel-media-caption{position:absolute;left:0;right:0;bottom:4px;padding:0 8px;text-align:center;
    font-family:'Zen Kurenaido',cursive;font-size:11.5px;line-height:1.4;color:var(--ink);}
  .panel-media.size-sub .panel-media-caption{bottom:3px;font-size:10.5px;}
  .panel-media::after{content:'📌';position:absolute;top:-14px;left:50%;transform:translateX(-50%) rotate(-10deg);font-size:20px;}
  .panel-media-inner{position:relative;width:100%;aspect-ratio:4/3;background:#000;overflow:hidden;}
  .panel-media img,.panel-media video{width:100%;height:100%;object-fit:cover;display:block;}
  .panel-media-fallback{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:rgba(255,255,255,0.9);font-family:'JetBrains Mono',monospace;text-align:center;padding:0 10px;}
  .panel-media-fallback strong{font-size:10.5px;font-weight:500;}
  .panel-media-fallback span{font-size:9px;opacity:0.75;word-break:break-all;}

  /* タイトル・メタ情報・タグは、常にウィンドウの左上にまとまるブロックにしている
     (floatにせず、写真/動画とは別の独立したブロックにすることで位置がぶれないようにしている) */
  .panel-header{display:flex;gap:20px;align-items:flex-start;flex-wrap:wrap;margin-bottom:10px;}
  .panel-header-text{flex:1 1 180px;min-width:180px;padding-right:36px;}
  .panel-meta{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft);}
  .panel-title{font-family:'Zen Kurenaido',cursive;font-size:28px;font-weight:400;margin:4px 0 14px;line-height:1.3;color:var(--ink);}
  .panel-title-image{display:none;width:340px;max-width:100%;aspect-ratio:1800/1080;object-fit:cover;border-radius:4px;margin:6px 0 14px;}
  .panel-title-image.show{display:block;}
  .panel-title.hide-for-image{display:none;}
  .panel-desc{font-family:'Zen Kurenaido',cursive;font-size:16.5px;line-height:1.9;color:var(--ink);margin:0 0 18px;white-space:pre-wrap;}
  /* タグ: ピン留めや紙の付箋の土台は使わず、ウィンドウの右辺にぴったり右辺を揃えた
     リボン状のタブとして表示する。長さ(左端の位置)は文章量に応じて自動で変わる。
     .panel-body には右側に26pxの内側余白があるため、right:-26px でその分を打ち消し、
     ウィンドウ(#panel)の実際の右端に一致させている */
  .panel-tags-flag{position:absolute;top:56px;right:-26px;display:flex;flex-direction:column;
    align-items:flex-end;gap:10px;max-width:calc(100% - 20px);z-index:2;}
  .panel-tags{display:flex;flex-direction:column;align-items:flex-end;gap:10px;}
  .tag{font-family:'Zen Kurenaido',cursive;font-size:16px;line-height:1.4;white-space:nowrap;
    padding:10px 28px 10px 22px;border-radius:10px 0 0 10px;color:var(--ink);
    background:rgba(143,179,57,0.32);border-top:2px solid rgba(34,49,66,0.18);
    border-bottom:2px solid rgba(34,49,66,0.18);box-shadow:-2px 3px 8px rgba(34,49,66,0.18);}
  .tag:nth-child(3n+1){background:rgba(255,89,72,0.24);}
  .tag:nth-child(3n+2){background:rgba(53,53,239,0.20);}
  .tag:nth-child(3n){background:rgba(230,239,46,0.34);}

  /* リンク: ヒント/ツールチップと同じ付箋デザイン */
  .panel-links{display:flex;flex-wrap:wrap;gap:16px 14px;clear:both;margin-top:22px;}
  .panel-link{position:relative;display:inline-flex;align-items:center;gap:6px;background:#FFE993;border-radius:2px 2px 8px 2px;padding:10px 16px 12px;font-family:'Zen Kurenaido',cursive;font-size:13px;color:#4A3B1E;text-decoration:none;box-shadow:2px 3px 6px rgba(34,49,66,0.25);transition:transform .15s ease,box-shadow .15s ease;}
  .panel-link::before{content:'';position:absolute;top:-9px;left:50%;transform:translateX(-50%) rotate(-4deg);width:42px;height:15px;background:rgba(255,111,89,0.55);border:1px solid rgba(255,111,89,0.7);}
  .panel-link .panel-link-arrow{font-size:11px;opacity:0.75;}
  .panel-link:hover{transform:translateY(-3px) rotate(0deg) !important;box-shadow:3px 6px 12px rgba(34,49,66,0.32);}
  .panel-link:nth-child(3n+1){transform:rotate(-2deg);}
  .panel-link:nth-child(3n+2){transform:rotate(2.5deg);}
  .panel-link:nth-child(3n){transform:rotate(-1.5deg);}

  /* 担当クレジット: ウィンドウの最下部に小さく表示。
     sticky + bottom:0 なので、内容が短い時はウィンドウの一番下、長い時は末尾に収まる */
  .panel-credit{position:sticky;bottom:0;margin-top:26px;padding:8px 0 2px;background:var(--cream);
    font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:.03em;color:var(--ink-soft);text-align:right;}
  .panel-credit:empty{display:none;}

  /* 写真クリックでの全画面表示(ライトボックス) */
  .panel-media-inner{cursor:pointer;}
  .panel-media-inner img{transition:transform .2s ease;}
  .panel-media-inner img:hover{transform:scale(1.04);}

  /* 動画のプレビューは操作できないようにし、中央の再生アイコンをクリックすると
     全画面表示で再生が始まる */
  .media-preview-video{pointer-events:none;cursor:default;}
  .media-play-icon{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:52px;height:52px;border-radius:50%;background:rgba(0,0,0,0.5);color:#fff;display:flex;align-items:center;justify-content:center;font-size:18px;padding-left:3px;cursor:pointer;z-index:3;transition:background .15s ease,transform .15s ease;}
  .media-play-icon:hover{background:var(--coral);transform:translate(-50%,-50%) scale(1.08);}
  #lightbox{position:fixed;inset:0;z-index:50;background:rgba(15,20,26,0.92);display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .25s ease;}
  #lightbox.open{opacity:1;pointer-events:auto;}
  #lightbox-content{max-width:90vw;max-height:88vh;display:flex;align-items:center;justify-content:center;}
  #lightbox-content img,#lightbox-content video{max-width:90vw;max-height:88vh;object-fit:contain;box-shadow:0 10px 40px rgba(0,0,0,0.5);border-radius:2px;}
  /* YouTube埋め込み(ライトボックス内)。画面に収まる最大の16:9にする */
  #lightbox-content iframe{width:min(90vw, calc(88vh * 16 / 9));aspect-ratio:16/9;border:0;background:#000;box-shadow:0 10px 40px rgba(0,0,0,0.5);border-radius:2px;}
  #lightbox-close{position:fixed;top:24px;right:28px;width:42px;height:42px;border-radius:50%;border:2px solid #fff;background:rgba(0,0,0,0.35);color:#fff;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:51;}
  #lightbox-close:hover{background:var(--coral);border-color:#fff;}

  /* ========================= セリフ(ダイアログ)ボックス =========================
     画面下1/3にノート風の背景。中央にテキスト、右下にクリックを促す下向き矢印。
     表示中は #dialogue-click-catcher が画面全体を覆い、どこをクリックしても
     次のセリフへ進む(セリフを読み終える前に机の作品に触れてしまうのを防ぐため)。
     表示するセリフは JS の DIALOGUE_LINES 配列で管理。 */
  #dialogue-click-catcher{position:fixed;inset:0;z-index:11;pointer-events:none;}
  #dialogue-click-catcher.active{pointer-events:auto;cursor:pointer;}

  #dialogue-box{position:fixed;left:0;right:0;bottom:0;height:33vh;z-index:12;
    display:flex;align-items:center;justify-content:center;overflow:hidden;
    background-color:var(--cream);
    background-image:repeating-linear-gradient(to bottom, transparent 0 30px, rgba(91,107,124,0.16) 30px 31px);
    background-position:0 6px;
    box-shadow:0 -3px 4px rgba(34,49,66,0.15), 0 -6px 18px rgba(34,49,66,0.22);
    cursor:pointer;
    opacity:0;pointer-events:none;transform:translateY(14px);
    transition:opacity .35s ease, transform .35s ease;}
  #dialogue-box.show{opacity:1;pointer-events:auto;transform:translateY(0);}
  #dialogue-box::before{content:'';position:absolute;top:0;bottom:0;left:44px;width:1px;background:rgba(255,111,89,0.4);}
  #dialogue-text{max-width:720px;padding:0 90px 0 66px;font-family:'Zen Kurenaido',cursive;
    font-size:clamp(16px,2.3vw,22px);line-height:1.9;color:var(--ink);text-align:center;white-space:pre-wrap;}
  #dialogue-next-arrow{position:absolute;right:30px;bottom:20px;font-size:20px;color:var(--ink-soft);
    animation:dialogue-bounce 1.3s ease-in-out infinite;}
  @keyframes dialogue-bounce{0%,100%{transform:translateY(0);}50%{transform:translateY(6px);}}

  @media(max-width:640px){
    #dialogue-box{height:36vh;}
    #dialogue-text{padding:0 50px 0 40px;}
    #dialogue-next-arrow{right:16px;bottom:14px;}
  }

  /* Intro sequence (導入映像 → タイトル → 説明) + circular transition */
  #intro-container{position:fixed;inset:0;z-index:100;background:var(--mint);}
  #intro-container.hidden{display:none;}
  .intro-stage{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .5s ease;}
  .intro-stage.active{opacity:1;pointer-events:auto;}

  #intro-stage-video{background:#000;}
  #intro-video{width:100%;height:100%;object-fit:cover;display:block;}
  /* YouTube版の導入映像。mp4の object-fit:cover と同じく、画面全体を覆うように16:9を拡大して中央に配置する。
     iframe は pointer-events:none にして、画面クリック(再生開始)を背後の導入コンテナが受け取れるようにする */
  #intro-yt-wrap{position:absolute;inset:0;overflow:hidden;background:#000;}
  #intro-yt-wrap iframe{position:absolute;top:50%;left:50%;width:max(100vw,177.78vh);height:max(100vh,56.25vw);transform:translate(-50%,-50%);border:0;pointer-events:none;}
  /* 再生前・終了時にYouTube標準の再生ボタンや関連動画が見えないよう、サムネイル(JSで設定)で覆っておく。再生が始まるとフェードアウト */
  #intro-yt-cover{position:absolute;inset:0;background:#000 center/cover no-repeat;transition:opacity .4s ease;pointer-events:none;}
  #intro-yt-cover.hide{opacity:0;}

  .title-inner{text-align:center;padding:0 24px;}
  .title-heading{font-family:'Zen Kurenaido',sans-serif;font-weight:600;font-size:clamp(28px,5.5vw,54px);color:var(--ink);margin:0;letter-spacing:0.3px;}
  .title-sub{font-family:'JetBrains Mono',monospace;font-size:12.5px;color:var(--ink-soft);margin:12px 0 0;letter-spacing:.08em;text-transform:uppercase;}
  .title-loader{margin:36px auto 0;width:30px;height:30px;border-radius:50%;border:3px solid rgba(34,49,66,0.15);border-top-color:var(--coral);animation:title-spin 0.9s linear infinite;}
  @keyframes title-spin{to{transform:rotate(360deg);}}

  .intro-explain-inner{max-width:640px;padding:0 32px;}
  .intro-explain-card{position:relative;width:100%;background-color:var(--cream);
    background-image:repeating-linear-gradient(to bottom, transparent 0 30px, rgba(91,107,124,0.16) 30px 31px);
    background-position:0 6px;
    padding:34px 28px 30px 46px;
    border-radius:3px;
    box-shadow:3px 4px 0 rgba(34,49,66,0.15), 6px 10px 18px rgba(34,49,66,0.22);
    transform:rotate(-0.6deg);}
  .intro-explain-card::before{content:'';position:absolute;top:0;bottom:0;left:32px;width:1px;background:rgba(255,111,89,0.4);}
  .intro-explain-card::after{content:'';position:absolute;top:-10px;left:50%;transform:translateX(-50%) rotate(-4deg);width:70px;height:26px;background:rgba(255,209,102,0.6);border:1px solid rgba(255,209,102,0.8);box-shadow:0 1px 2px rgba(34,49,66,0.15);}
  .intro-explain-text{font-family:'Zen Kurenaido',cursive;font-size:clamp(15px,2.2vw,18px);line-height:1.9;color:var(--ink);white-space:pre-wrap;margin:0;}

  #intro-skip-btn{position:fixed;top:20px;right:20px;z-index:101;background:rgba(34,49,66,0.55);color:#fff;border:1.5px solid rgba(255,255,255,0.7);border-radius:100px;padding:7px 14px;font-family:'JetBrains Mono',monospace;font-size:11.5px;letter-spacing:.03em;cursor:pointer;display:flex;align-items:center;gap:5px;transition:background .15s ease;}
  #intro-skip-btn:hover{background:var(--coral);}
  #intro-skip-btn.hidden{display:none;}

  @media(max-width:640px){
    .hud{padding:16px 16px;}
    .hud h1{font-size:17px;}
    .hud p{font-size:11px;}
    .hint{font-size:11px;padding:6px 10px;}
    #panel{width:94vw;height:90vh;}
    .panel-title{font-size:22px;}
    .panel-media{width:60%;max-width:220px;}
    .panel-tags-flag{top:50px;max-width:calc(100% - 14px);gap:8px;}
    .tag{font-size:13.5px;padding:8px 20px 8px 16px;}
    .flip-arrow-btn{font-size:11px;padding:6px 12px 6px 10px;left:14px;bottom:14px;}
    .flip-arrow-icon{font-size:14px;}
    .process-diagonal{grid-template-columns:1fr;row-gap:20px;}
    .process-section-a,.process-media-a,.process-section-b,.process-media-b{grid-column:1;margin-top:0;transform:none;}
    .process-media-a{justify-content:flex-start;}
  }
</style>
</head>
<body>

<div id="intro-container">
  <div class="intro-stage active" id="intro-stage-video">
    <!-- 導入映像のURLは、下の script 内の INTRO_VIDEO_URL で指定します(YouTube / mp4 どちらでもOK) -->
    <video id="intro-video" playsinline preload="auto"></video>
    <div id="intro-yt-wrap" hidden>
      <div id="intro-yt-player"></div>
      <div id="intro-yt-cover"></div>
    </div>
  </div>

  <div class="intro-stage" id="intro-stage-title">
    <div class="title-inner">
      <h1 class="title-heading">Tiny desk of Shidai Asakawa</h1>
      <p class="title-sub">Photo &amp; Video Portfolio</p>
      <div class="title-loader" id="title-loader"></div>
    </div>
  </div>

  <div class="intro-stage" id="intro-stage-explain">
    <div class="intro-explain-inner">
      <div class="intro-explain-card">
        <!-- 作品説明パネル(#panel)と同じ要素・並び順(タイトル → 写真/映像 → 文章)。
             それぞれのプレースホルダーを差し替えてください。
             写真/映像を増やしたい場合は .panel-media のブロックをコピーして追加できます
             (size-main / size-sub で大小を切り替え可能。動画にする場合は img を video に変更) -->
        <h2 class="panel-title" id="intro-explain-title">制作の記録</h2>

        <div class="panel-media-group" id="intro-explain-media">
          <div class="panel-media size-main" style="transform:rotate(-3deg)">
            <div class="panel-media-inner" style="background:#223142">
              <img src="media/intro-explain-photo1.jpg" alt="">

          </div>

        <p class="intro-explain-text panel-desc" id="intro-explain-text">この映像は、制作の記録として撮影したものです。</p>
      </div>
    </div>
  </div>
</div>

<button id="intro-skip-btn" title="スキップ">スキップ ⏭</button>

<div id="scene-container"></div>
<div class="tilt-shift top"></div>
<div class="tilt-shift bottom"></div>

<div class="hud">

<button id="reset-btn" title="視点をリセット">⟲</button>

</button>
<div id="tag-filter-menu">

<!-- セリフ(ダイアログ)システム。表示中は画面全体のクリックでセリフを送れるようにするための

              <p class="process-text" id="panel-process-text-2"></p>

</div>

/* ========================= THREE SETUP ========================= */
const container = document.getElementById('scene-container');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xDCEFE6);
scene.fog = new THREE.Fog(0xDCEFE6, 13, 27);

const camera = new THREE.PerspectiveCamera(35, window.innerWidth/window.innerHeight, 0.1, 100);

const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
container.appendChild(renderer.domElement);

/* Lighting: 部屋の中は暗めにして、机にだけスポットライトを当てる
   角度はほぼ真上(垂直から約12度)だと、カメラから見える手前側の面に光が回らず
   オブジェクトが暗く見えてしまうため、もっとしっかり手前寄りの角度にしている
   (垂直から約34度。真上からの照明ではなく、斜め手前から当たる形にすることで
    カメラに見える面がちゃんと明るくなる) */
scene.add(new THREE.AmbientLight(0xB9C6D4, 0.1));

const deskSpot = new THREE.SpotLight(0xFFF3DA, 1.3, 16, Math.PI/5.3, 0.45, 1.3);
deskSpot.position.set(0.6, 4.5, 3.0);
deskSpot.target.position.set(0, 0.15, 0);
deskSpot.castShadow = true;
deskSpot.shadow.mapSize.set(1024,1024);
deskSpot.shadow.camera.near = 1;

/* ========================= 壁・窓・部屋 ========================= */
/*
  机の奥(Zマイナス側)・左右・そして手前側(Zプラス側、カメラのいる側)にも
  距離を空けて壁を立て、机を完全に部屋で囲んでいる。

  絶対に届かない位置まで離してあるので、カメラが壁の中に入り込むことはない
*/
const WALL_Z = -(DESK_HALF_Z + 0.5); // ベッドフレームの奥行きと干渉しないよう余裕を持たせる

/* FRONT_WALL_Z: カメラが手前方向に届きうる最大距離(理論値 約6.63)より
   さらに余裕を持たせた位置。この数値を変えるときは、カメラの可動域
   (下の「CAMERA ORBIT CONTROLS」の radius/theta/phi の範囲)と矛盾しないよう注意 */
const FRONT_WALL_Z = 7.6;

const wallMat = new THREE.MeshStandardMaterial({ color:0xE7E1CE, roughness:0.95, flatShading:true });

/* 大きめの窓の寸法(壁に実際の穴を開けるため、壁より先に決めておく) */
const windowW = 4.6, windowH = 3.4;
const windowCenterY = 2.7;
const windowTop = windowCenterY + windowH/2;
const windowBottom = windowCenterY - windowH/2;

/* 奥の壁は、窓の部分だけ実際に穴が空くよう4枚(上/下/左/右)に分けて作る。
   1枚の板の前に窓ガラスを重ねているだけだと、板自体が不透明なままなので
   外の空が見えない。実際に穴を開けることで、窓ガラス越しに空が透けて見える */
function makeWallSegment(w,h,x,y,z=WALL_Z){
  const seg = new THREE.Mesh(new THREE.BoxGeometry(w, h, 0.2), wallMat);
  seg.position.set(x, y, z);
  seg.receiveShadow = true;
  fallbackScene.add(seg);
  return seg;
}
makeWallSegment(wallWidth, WALL_TOP - windowTop, 0, (WALL_TOP + windowTop)/2); // 窓の上
makeWallSegment(wallWidth, windowBottom - FLOOR_Y, 0, (FLOOR_Y + windowBottom)/2); // 窓の下
const wallSideWidth = (wallWidth - windowW)/2;
makeWallSegment(wallSideWidth, windowH, -(windowW/2 + wallSideWidth/2), windowCenterY); // 窓の左
makeWallSegment(wallSideWidth, windowH, (windowW/2 + wallSideWidth/2), windowCenterY); // 窓の右

/* 手前側の壁(カメラの可動域より外側。窓は無い、ただの壁) */

/* 左右の壁(奥の壁から手前の壁まで、部屋を完全に囲む) */

/* 大きめの窓(額縁+十字の桟)。ガラスは入れず、実際に何もない「穴」のままにして

   以前は「額縁」のつもりで窓の開口部より一回り大きい1枚の板を置いていたため、

/* ========================= 窓の外の空(朝〜夜のサイクル) ========================= */
/*
  壁の向こう側(さらに奥)に、空の板と太陽/月を配置している。
  壁は不透明・窓だけ透明にしているので、空は窓を通してだけ見える。
  DAY_CYCLE_SECONDS ごとに 朝→昼→夕→夜→(また朝へ) を繰り返す。
  MeshBasicMaterial + fog:false で、部屋の暗さやフォグの影響を受けず
  常にはっきりした空の色になるようにしている
*/
/* SKY_Z: 以前は壁からかなり離した位置(WALL_Z-5)に空を置いていたが、
   シーンのフォグ(霧、13〜27の距離で効き始める)の範囲に入ってしまい、
   薄い空の色がフォグや背景色と紛れて「白っぽく」見えてしまっていた。
   壁のすぐ後ろに近づけることでフォグの影響を確実に避けている */
const SKY_Z = WALL_Z - 0.4;
const skyWidth = wallWidth * 1.3;
const skyHeight = wallHeight * 1.3;
const skyMat = new THREE.MeshBasicMaterial({ color:0x5AA9E6, fog:false, depthWrite:true });
const sky = new THREE.Mesh(new THREE.PlaneGeometry(skyWidth, skyHeight), skyMat);
sky.position.set(0, FLOOR_Y + skyHeight/2.6, SKY_Z);

const sunMoonMat = new THREE.MeshBasicMaterial({ color:0xFFE9B0, fog:false });

/* 窓から差し込む光。昼は太陽光(明るく暖色)、夜は月明かり(暗めで青みがかった色)になる */
const windowLight = new THREE.DirectionalLight(0xFFF6D6, 0.8);
windowLight.position.set(0, windowCenterY + 0.6, WALL_Z - 1.2);
windowLight.target.position.set(0, 0.3, 1.2);
scene.add(windowLight);
scene.add(windowLight.target);

const DAY_CYCLE_SECONDS = 90;
/* 昼と夜、それぞれしっかり長く続く「プラトー」区間を持たせている。
   キーフレーム間を単純に繋ぐだけだと、明るい「昼」が一瞬のピークにしかならず、
   90秒のサイクルのほとんどが夕方〜夜の暗い色になってしまい、
   数秒だけ見ると「ずっと暗いまま」に見えてしまうため */
const SKY_KEYFRAMES = [
  { t:0.00, sky:0xFFB37A, body:0xFFE9B0, light:0xFFD9A0, intensity:0.55 }, // 朝焼け
  { t:0.12, sky:0x5AA9E6, body:0xFFF6D6, light:0xFFF6D6, intensity:0.95 }, // 昼はじまり
  { t:0.42, sky:0x5AA9E6, body:0xFFF6D6, light:0xFFF6D6, intensity:0.95 }, // 昼つづく
  { t:0.55, sky:0xE8795C, body:0xFFD3A0, light:0xFFB37A, intensity:0.5 },  // 夕方
  { t:0.68, sky:0x2A3A5C, body:0xEAF1FF, light:0x8FA8E0, intensity:0.3 },  // 夜はじまり(月明かり)
  { t:0.92, sky:0x2A3A5C, body:0xEAF1FF, light:0x8FA8E0, intensity:0.3 },  // 夜つづく
  { t:1.00, sky:0xFFB37A, body:0xFFE9B0, light:0xFFD9A0, intensity:0.55 }, // また朝焼けへ
];
const _skyColorA = new THREE.Color();
const _skyColorB = new THREE.Color();
function updateDayNightCycle(elapsed){
  const phase = (elapsed % DAY_CYCLE_SECONDS) / DAY_CYCLE_SECONDS;
  let seg = SKY_KEYFRAMES[0];
  for(let i=0;i<SKY_KEYFRAMES.length-1;i++){
    if(phase >= SKY_KEYFRAMES[i].t && phase <= SKY_KEYFRAMES[i+1].t){ seg = SKY_KEYFRAMES[i]; break; }
  }
  const idx = SKY_KEYFRAMES.indexOf(seg);
  const next = SKY_KEYFRAMES[idx+1];
  const localT = (phase - seg.t) / (next.t - seg.t || 1);

  _skyColorA.set(seg.sky); _skyColorB.set(next.sky);
  skyMat.color.copy(_skyColorA).lerp(_skyColorB, localT);

  _skyColorA.set(seg.body); _skyColorB.set(next.body);
  sunMoonMat.color.copy(_skyColorA).lerp(_skyColorB, localT);

  _skyColorA.set(seg.light); _skyColorB.set(next.light);
  windowLight.color.copy(_skyColorA).lerp(_skyColorB, localT);
  windowLight.intensity = seg.intensity + (next.intensity - seg.intensity) * localT;

  /* 太陽/月が空を横切るように、弧を描いて上下する */
  const arc = Math.sin(phase * Math.PI * 2 - Math.PI/2); // -1(夜中)〜1(正午)
  sunMoon.position.x = Math.cos(phase * Math.PI * 2) * (windowW*0.42);
  sunMoon.position.y = windowCenterY + arc * (windowH*0.5);
}

/* ========================= HELPERS ========================= */
function mat(color, extra={}){ return new THREE.MeshStandardMaterial({ color, flatShading:true, roughness:0.55, metalness:0.05, ...extra }); }
function box(w,h,d,color,extra){ const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d), mat(color,extra)); m.castShadow=true; m.receiveShadow=true; return m; }
function cyl(rt,rb,h,color,seg=16,extra){ const m=new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,seg), mat(color,extra)); m.castShadow=true; m.receiveShadow=true; return m; }
function sph(r,color,extra){ const m=new THREE.Mesh(new THREE.SphereGeometry(r,14,10), mat(color,extra)); m.castShadow=true; m.receiveShadow=true; return m; }

const entryAnimations = [];
const restYById = {};
const restScaleById = {};
const entranceCompletedIds = new Set();
let entranceStartTime = null;
function easeOutBounce(t){
  const n1=7.5625, d1=2.75;
  if(t<1/d1) return n1*t*t;
  if(t<2/d1){ t-=1.5/d1; return n1*t*t+0.75; }
  if(t<2.5/d1){ t-=2.25/d1; return n1*t*t+0.9375; }
  t-=2.625/d1; return n1*t*t+0.984375;
}
function easeOutBack(t){
  const c1=1.70158, c3=c1+1;
  return 1 + c3*Math.pow(t-1,3) + c1*Math.pow(t-1,2);
}
function playEntranceAnimation(){
  entryAnimations.length = 0;
  entranceCompletedIds.clear();
  projectsData.forEach((d, i)=>{
    const g = groupsById[d.id];
    if(!g) return;
    const restY = g.position.y;
    restYById[d.id] = restY;
    const restScale = g.scale.clone(); // 元のスケール(procedural=1、Blenderモデルはそのオブジェクト本来の値)を保持
    restScaleById[d.id] = restScale;
    g.position.y = restY + 2.4;
    g.scale.set(0.001,0.001,0.001);
    entryAnimations.push({ group:g, pid:d.id, restY, restScale, dropHeight:2.4, delay:0.3 + i*0.15, duration:0.9, done:false });
  });
  entranceStartTime = performance.now();
}

/* ========================= PLACE OBJECTS ========================= */
/* 配置はすべて projectsData の build から作り、位置(x/z)と向き(ry)は
   ページを開くたびにランダムに決めます(重なりすぎないよう簡易な当たり判定つき)。
   projectsData 内の x / z / ry の値は使われなくなりましたが、
   ランダム配置をやめて固定配置に戻したい場合の参考用に残してあります。 */
const CLICKABLE_SCALE = 1.55; // クリック可能なオブジェクトの見た目の大きさ(倍率)
const DESK_BOUNDS = { xMin:-3.9, xMax:3.9, zMin:-2.2, zMax:2.2 };
const RANDOM_MIN_DIST = 1.3; // オブジェクト同士の最低距離の目安

function randomDeskLayout(count){
  const positions = [];
  for(let i=0;i<count;i++){
    let placed = false;
    for(let attempt=0; attempt<400 && !placed; attempt++){
      const x = DESK_BOUNDS.xMin + Math.random()*(DESK_BOUNDS.xMax-DESK_BOUNDS.xMin);
      const z = DESK_BOUNDS.zMin + Math.random()*(DESK_BOUNDS.zMax-DESK_BOUNDS.zMin);
      if(positions.every(p => Math.hypot(p.x-x, p.z-z) >= RANDOM_MIN_DIST)){
        positions.push({x,z});
        placed = true;
      }
    }
    if(!placed){
      /* 400回試しても空きが見つからなければ、均等グリッドにフォールバックして確実に配置する */
      const cols = Math.ceil(Math.sqrt(count));
      const rows = Math.ceil(count/cols);
      const col = i % cols, row = Math.floor(i/cols);
      const x = DESK_BOUNDS.xMin + (col+0.5)*(DESK_BOUNDS.xMax-DESK_BOUNDS.xMin)/cols;
      const z = DESK_BOUNDS.zMin + (row+0.5)*(DESK_BOUNDS.zMax-DESK_BOUNDS.zMin)/rows;
      positions.push({x,z});
    }
  }
  return positions;
}

/* ========================= タグで机の上を整理する ========================= */
/*
  画面端のボタンを押すとタグ一覧が出てきて、選んだタグの作品だけを
  机の上にきれいに整列させ、それ以外は机を囲むように少し離れて待機させる。

  移動中は「小人が跳ねながら歩いてくる」ような動きにしている:
  ・数回のホップ(跳躍)に分けて移動する
  ・ホップのたびに体を左右にちょこっと傾ける(ワドル歩き)
  ・ホップの頂点を他のオブジェクトより高くすることで、
    真上を飛び越える形になり、衝突をシンプルに回避している
*/
const moveAnimations = [];

function hopMoveObject(group, targetX, targetY, targetZ, targetRy, delay=0){
  moveAnimations.push({
    group,
    startX: group.position.x, startY: group.position.y, startZ: group.position.z,
    startRy: group.rotation.y,
    targetX, targetY, targetZ, targetRy,
    hops: 3 + Math.floor(Math.random()*2), // 3〜4回ホップ
    duration: 1.0 + Math.random()*0.35,
    startTime: performance.now() + delay*1000,
    done:false,
  });
}

function updateMoveAnimations(){
  if(!moveAnimations.length) return;
  const now = performance.now();
  moveAnimations.forEach(item=>{
    if(item.done) return;
    const elapsed = (now - item.startTime)/1000;
    if(elapsed <= 0) return;
    const p = Math.min(elapsed/item.duration, 1);
    const ease = 1 - Math.pow(1-p, 2); // easeOutQuad

    const x = item.startX + (item.targetX-item.startX)*ease;
    const z = item.startZ + (item.targetZ-item.startZ)*ease;
    const baseY = item.startY + (item.targetY-item.startY)*ease;

    const hopPhase = p * item.hops * Math.PI;
    const hopHeight = 1.15 * Math.abs(Math.sin(hopPhase)) * (1 - p*0.2); // 他のオブジェクトより高く跳ぶ
    const waddle = Math.sin(hopPhase*2) * 0.22 * (1 - p*0.3); // 左右にちょこっと傾く

    item.group.position.set(x, baseY + hopHeight, z);
    item.group.rotation.y = item.startRy + (item.targetRy-item.startRy)*ease;
    item.group.rotation.z = waddle;

    if(p >= 1){
      item.group.position.set(item.targetX, item.targetY, item.targetZ);
      item.group.rotation.y = item.targetRy;
      item.group.rotation.z = 0;
      item.done = true;
    }
  });
  if(moveAnimations.every(m=>m.done)) moveAnimations.length = 0;
}

function computeAlignedPositions(count){
  if(count === 0) return [];
  const cols = Math.min(count, 6);
  const rows = Math.ceil(count/cols);
  const spacingX = 1.35, spacingZ = 1.35;
  const totalW = (cols-1)*spacingX, totalH = (rows-1)*spacingZ;
  const positions = [];
  for(let i=0;i<count;i++){
    const col = i % cols, row = Math.floor(i/cols);
    positions.push({ x: -totalW/2 + col*spacingX, z: -totalH/2 + row*spacingZ });
  }
  return positions;
}

function pointOnRectPerimeter(t, halfW, halfH){
  /* t(0〜1)を長方形の外周に沿った距離とみなして、その位置の座標を返す
     (楕円だと机の対角方向で机の内側に入り込んでしまうため、机と同じ長方形の
      外周をなぞる形にして、どの方向でも確実に机の外に出るようにしている) */
  const w = halfW*2, h = halfH*2;
  const perimeter = 2*(w+h);
  let d = ((t % 1) + 1) % 1 * perimeter;
  if(d < w) return { x: -halfW + d, z: -halfH };
  d -= w;
  if(d < h) return { x: halfW, z: -halfH + d };
  d -= h;
  if(d < w) return { x: halfW - d, z: halfH };
  d -= w;
  return { x: -halfW, z: halfH - d };
}

function computeWaitingPositions(count){
  /* 絞り込みで外れたオブジェクトは、机を囲むように、机より一段低い床の高さで待機させる。
     机と同じ長方形の外周に沿って均等に並べることで、対角方向でも
     確実に机の外側(床の上)に出るようにしている */
  if(count === 0) return [];
  const halfW = DESK_HALF_X + FLOOR_MARGIN;
  const halfH = DESK_HALF_Z + FLOOR_MARGIN;
  const positions = [];
  for(let i=0;i<count;i++){
    const t = i / count;
    const p = pointOnRectPerimeter(t, halfW, halfH);
    positions.push({ x:p.x, y:FLOOR_Y, z:p.z });
  }
  return positions;
}

      if(!g) return;
      const pos = randomPositions[i];
      const ry = (Math.random()-0.5) * 2.2;
      hopMoveObject(g, pos.x, restYById[item.id] ?? 0, pos.z, ry, i*0.05);
    });
  } else {
    const matching = clickableItems.filter(item=>{
      const d = projectsData.find(p=>p.id===item.id);
      return d && d.tags && d.tags.includes(tag);
    });
    const nonMatching = clickableItems.filter(item=> !matching.includes(item));

    const alignedPositions = computeAlignedPositions(matching.length);
    matching.forEach((item, i)=>{
      const g = groupsById[item.id];
      if(!g) return;
      hopMoveObject(g, alignedPositions[i].x, restYById[item.id] ?? 0, alignedPositions[i].z, 0, i*0.08);
    });

    const waitingPositions = computeWaitingPositions(nonMatching.length);
    nonMatching.forEach((item, i)=>{
      const g = groupsById[item.id];
      if(!g) return;
      const pos = waitingPositions[i];
      hopMoveObject(g, pos.x, pos.y, pos.z, g.rotation.y, i*0.04);
    });
  }

  document.querySelectorAll('.tag-filter-chip').forEach(chip=>{
    chip.classList.toggle('active', chip.dataset.tag === (tag ?? '__all__'));
  });
  document.getElementById('tag-filter-menu').classList.remove('open');
}

function createIntroYouTubePlayer(){
  const playerVars = { controls:0, disablekb:1, fs:0, rel:0, modestbranding:1, iv_load_policy:3, playsinline:1 };
  if (introYT.start) playerVars.start = introYT.start;
  if (/^https?:$/.test(location.protocol)) playerVars.origin = location.origin;
  ytPlayer = new YT.Player('intro-yt-player', {
    videoId: introYT.id,
    playerVars,
    events: {
      onReady: ()=>{
        ytReady = true;
        if (ytWantPlay && introIndex === 0) ytStartPlayback();
      },
      onStateChange: (e)=>{
        if (e.data === YT.PlayerState.PLAYING) {
          clearTimeout(ytRetryTimer);
          introYTCover.classList.add('hide');
        } else if (e.data === YT.PlayerState.ENDED) {
          introYTCover.classList.remove('hide'); // 終了画面(関連動画など)を見せない
          if (introIndex === 0) advanceIntro();

      },
      onAutoplayBlocked: ytMutedFallback,
      onError: (e)=> onIntroVideoFailed('YouTube error code ' + e.data)

/* ========================= 作品ごとにBlenderモデルを割り当てる ========================= */
/*
  机はこれまで通りコードで作った簡易モデルのままにしておき、
  作品オブジェクトだけを1つずつ、自作の.glbに差し替えられるようにしています。

  ワークフロー:
  1. Blenderで作品ひとつぶんのモデルを作る(机は含めなくてOK)
  2. File > Export > glTF 2.0 (.glb) で書き出す
       - Format: glTF Binary (.glb)
       - Transform: +Y Up のままでOK（Blenderが自動でZ-up→Y-up変換する）
       - Geometry > Apply Modifiers をオン推奨
  3. 書き出した .glb をこのHTMLと同じフォルダ(例: models/ フォルダ)に置く
  4. projectsData の該当する作品に modelUrl フィールドを追加する
       例: modelUrl:'models/vr.glb'
  5. modelUrl を書いていない作品は、今まで通りコードで作った簡易モデルのままになる

  読み込みに失敗した場合も、その作品だけコードで作った簡易モデルのまま表示され続けるので
  安全です（他の作品や机には影響しません）。
  （file:// で直接開くと読み込めないブラウザがあります。
    VS CodeのLive Serverなど簡易ローカルサーバー経由で確認してください）
*/
const modelGLTFLoader = new THREE.GLTFLoader();
let pendingModelLoads = 0;

function checkAllModelsSettled(){
  if(pendingModelLoads <= 0){
    modelLoadSettled = true;
    tryRevealScene();
  }
}

function swapInCustomModel(item, gltf){
  const oldGroup = groupsById[item.id];
  if(!oldGroup) return;

  /* 差し替える瞬間の位置・向き・(跳ねている途中かもしれない)高さをそのまま引き継ぐ */
  const { x: px, y: py, z: pz } = oldGroup.position;
  const ry = oldGroup.rotation.y;

  const model = gltf.scene;
  let meshCount = 0;
  model.traverse(node=>{
    if(node.isMesh){
      node.castShadow = true; node.receiveShadow = true; meshCount++;
      /* Blenderエクスポートで法線が反転していても見えるよう、両面表示を強制 */
      const mats = Array.isArray(node.material) ? node.material : [node.material];
      mats.forEach(m=>{ if(m) m.side = THREE.DoubleSide; });
    }
  });

  if(meshCount === 0){
    console.warn(`[portfolio] "${item.id}" の modelUrl (${item.modelUrl}) にメッシュが見つかりませんでした。簡易モデルのままにします。`);
    return;
  }

  /* サイズを他の作品と揃うように自動調整し、モデルの底面が地面(y=0)に来るようにする */
  const box3 = new THREE.Box3().setFromObject(model);
  const size = new THREE.Vector3(); box3.getSize(size);
  const maxDim = Math.max(size.x, size.y, size.z) || 1;
  const TARGET_SIZE = 0.9; // procedural側のオブジェクトと大体揃う目安の大きさ
  const scale = TARGET_SIZE / maxDim;

  const center = new THREE.Vector3(); box3.getCenter(center);
  model.position.set(-center.x, -box3.min.y, -center.z);

  const wrapper = new THREE.Group();
  wrapper.add(model);
  wrapper.scale.setScalar(scale * CLICKABLE_SCALE);
  wrapper.position.set(px, py, pz);
  wrapper.rotation.y = ry;
  wrapper.userData.pid = item.id;
  wrapper.traverse(node=>{ node.userData.pid = item.id; });

  fallbackScene.remove(oldGroup);
  fallbackScene.add(wrapper);
  groupsById[item.id] = wrapper;
  restYById[item.id] = py;
  restScaleById[item.id] = wrapper.scale.clone();

  console.info(`[portfolio] "${item.id}" を自作モデル(${item.modelUrl})に差し替えました。`);
}

clickableItems.forEach(item=>{
  if(!item.modelUrl) return;
  pendingModelLoads++;
  modelGLTFLoader.load(
    item.modelUrl,
    (gltf)=>{
      try {
        swapInCustomModel(item, gltf);
      } catch(err){
        console.error(`[portfolio] "${item.id}" のモデル差し替え処理中にエラーが発生しました。簡易モデルのままにします。`, err);
      }
      pendingModelLoads--;
      checkAllModelsSettled();
    },
    undefined,
    (err)=>{
      console.warn(`[portfolio] "${item.id}" の modelUrl (${item.modelUrl}) の読み込みに失敗しました。簡易モデルのままにします。`, err);
      pendingModelLoads--;
      checkAllModelsSettled();
    }
  );
});

/* ========================= CAMERA ORBIT CONTROLS ========================= */
const target = new THREE.Vector3(0, 0.3, 0);
let radius = 6.0, theta = Math.PI*0.28, phi = Math.PI*0.32;
/* maxRadius: 部屋の壁(側面のX位置)の外にカメラが出てしまわないよう、
   THETA_MIN/MAX・minPhi〜maxPhi の可動域と合わせて計算した安全な上限にしている */
let minRadius=4.5, maxRadius=6.8;
/* minPhi: ロフトベッドを追加したので、真上から覗き込みすぎてベッドの下面に
   視界を塞がれてしまわないよう、以前(0.15)より少し制限している */
const minPhi=0.42, maxPhi=1.35;
/* THETA_MIN/MAX: 机の奥(Zマイナス側)に壁を設置したので、
   カメラがその壁の向こう側に回り込めないよう水平方向の角度も制限している */
const THETA_MIN = -1.75, THETA_MAX = 1.75;

function updateCamera(){
  camera.position.x = target.x + radius*Math.sin(phi)*Math.sin(theta);
  camera.position.y = target.y + radius*Math.cos(phi);
  camera.position.z = target.z + radius*Math.sin(phi)*Math.cos(theta);
  camera.lookAt(target);
}
updateCamera();

let isDragging=false, dragMoved=false, lastX=0, lastY=0, downX=0, downY=0, downTime=0;
let idleTimer=null; let autoRotate=false; let autoRotateDir=1;
const canvas = renderer.domElement;

function onPointerDown(e){
  isDragging=true; dragMoved=false; canvas.classList.add('dragging');
  const p = getPoint(e);
  lastX=downX=p.x; lastY=downY=p.y; downTime=performance.now();
  autoRotate=false; clearTimeout(idleTimer);
}
function onPointerMove(e){
  const p = getPoint(e);
  if(isDragging){
    const dx = p.x-lastX, dy=p.y-lastY;
    if(Math.abs(p.x-downX)>5||Math.abs(p.y-downY)>5) dragMoved=true;
    theta = Math.min(THETA_MAX, Math.max(THETA_MIN, theta - dx*0.006));
    phi = Math.min(maxPhi, Math.max(minPhi, phi - dy*0.006));
    lastX=p.x; lastY=p.y;
    updateCamera();
  } else {
    handleHover(p);
  }
}
function onPointerUp(e){
  const p = getPoint(e, true);
  isDragging=false; canvas.classList.remove('dragging');
  scheduleIdle();
  if(!dragMoved && performance.now()-downTime < 500){
    handleClick(p);
  }
}
function getPoint(e, useChanged=false){
  if(e.touches && e.touches.length) return {x:e.touches[0].clientX, y:e.touches[0].clientY};
  if(useChanged && e.changedTouches && e.changedTouches.length) return {x:e.changedTouches[0].clientX, y:e.changedTouches[0].clientY};
  return {x:e.clientX, y:e.clientY};
}
canvas.addEventListener('pointerdown', onPointerDown);
window.addEventListener('pointermove', onPointerMove);
window.addEventListener('pointerup', onPointerUp);
canvas.addEventListener('wheel', (e)=>{
  e.preventDefault();
  radius = Math.min(maxRadius, Math.max(minRadius, radius + e.deltaY*0.01));
  updateCamera();
}, {passive:false});

/* pinch zoom */
let pinchStart=null;
canvas.addEventListener('touchstart', e=>{
  if(e.touches.length===2){
    pinchStart = Math.hypot(e.touches[0].clientX-e.touches[1].clientX, e.touches[0].clientY-e.touches[1].clientY);
  }
}, {passive:true});
canvas.addEventListener('touchmove', e=>{
  if(e.touches.length===2 && pinchStart){
    const d = Math.hypot(e.touches[0].clientX-e.touches[1].clientX, e.touches[0].clientY-e.touches[1].clientY);
    radius = Math.min(maxRadius, Math.max(minRadius, radius - (d-pinchStart)*0.02));
    pinchStart = d;
    updateCamera();
  }
}, {passive:true});

function scheduleIdle(){
  clearTimeout(idleTimer);
  idleTimer = setTimeout(()=>{ autoRotate=true; }, 4500);
}
scheduleIdle();

document.getElementById('reset-btn').addEventListener('click', ()=>{
  radius=8.5; theta=Math.PI*0.28; phi=Math.PI*0.32; updateCamera();
});

/* ========================= RAYCAST / HOVER / CLICK ========================= */
const raycaster = new THREE.Raycaster();
const mouseNDC = new THREE.Vector2();
let hoveredId = null;
const tooltip = document.getElementById('tooltip');

function pickId(clientX, clientY){
  mouseNDC.x = (clientX/window.innerWidth)*2-1;
  mouseNDC.y = -(clientY/window.innerHeight)*2+1;
  raycaster.setFromCamera(mouseNDC, camera);
  const intersects = raycaster.intersectObjects(scene.children, true);
  for(const it of intersects){
    if(it.object.userData.pid) return it.object.userData.pid;
  }
  return null;
}

function handleHover(p){
  const id = pickId(p.x,p.y);
  if(id !== hoveredId){
    if(hoveredId && groupsById[hoveredId]) resetScale(groupsById[hoveredId], hoveredId);
    hoveredId = id;
    if(id && groupsById[id]){
      const base = restScaleById[id] || {x:1,y:1,z:1};
      groupsById[id].scale.set(base.x*1.08, base.y*1.08, base.z*1.08);
      canvas.style.cursor='pointer';
      tooltip.textContent = `${projectsData.find(d=>d.id===id).hoverLabel}を調べる`;
      tooltip.classList.add('show');
    } else {
      canvas.style.cursor='grab';
      tooltip.classList.remove('show');
    }
  }
  if(id){ tooltip.style.left=p.x+'px'; tooltip.style.top=p.y+'px'; }
}
function resetScale(g, id){
  const base = restScaleById[id] || {x:1,y:1,z:1};
  g.scale.set(base.x, base.y, base.z);
}

function handleClick(p){
  const id = pickId(p.x,p.y);
  if(id) openPanel(id);
}

/* ========================= PANEL ========================= */
const panel = document.getElementById('panel');
const backdrop = document.getElementById('panel-backdrop');

function isVideoFile(path){ return /\.(mp4|webm|mov|m4v)$/i.test(path); }

/* YouTube の URL から動画IDと開始秒数を取り出す。
   watch?v=ID / youtu.be/ID / embed/ID / shorts/ID / live/ID に対応。YouTubeでなければ null */
function parseYouTube(url){
  if(typeof url !== 'string') return null;
  let u;
  try { u = new URL(url); } catch(err){ return null; }
  const host = u.hostname.replace(/^www\.|^m\./, '');
  let id = null;
  if(host === 'youtu.be'){
    id = u.pathname.slice(1).split('/')[0];
  } else if(host === 'youtube.com' || host === 'youtube-nocookie.com'){
    if(u.pathname === '/watch') id = u.searchParams.get('v');
    else {
      const m = u.pathname.match(/^\/(?:embed|shorts|live|v)\/([^/?]+)/);
      if(m) id = m[1];
    }
  }
  if(!id || !/^[\w-]{11}$/.test(id)) return null;
  const t = u.searchParams.get('t') || u.searchParams.get('start');
  const start = t ? parseInt(t, 10) || 0 : 0; // 「90」「90s」形式に対応(1m30s形式は非対応)
  return { id, start };
}

/* 動画プレビューのサムネイル表示用ヘルパー。
   「勝手に再生されている」ように見えないよう、フレームが用意できるまで動画を非表示にしておき、
   準備ができてから初めて表示する(Safariなど、metadataだけでは最初のフレームを
   描画しないブラウザ向けに、無音での一瞬の再生+即停止も保険として行うが、
   非表示の間に行うためユーザーの目には触れない)。 */
function preparePreviewThumbnail(v){
  v.style.visibility = 'hidden';
  v.addEventListener('loadedmetadata', ()=>{
    let revealed = false;
    const reveal = ()=>{
      if(revealed) return;
      revealed = true;
      v.style.visibility = '';
    };
    /* まず currentTime を動かすだけでフレーム描画を試みる(多くのブラウザはこれで十分) */
    try { v.currentTime = 0.1; } catch(err){}
    v.addEventListener('seeked', reveal, { once:true });

    /* 保険: 上記だけではフレームが描画されない場合に備え、非表示のまま一瞬だけ再生してすぐ止める */
    const playPromise = v.play();
    if(playPromise && playPromise.then){
      playPromise.then(()=>{ v.pause(); reveal(); }).catch(()=> reveal());
    } else {
      reveal();
    }
    setTimeout(reveal, 800); // 何らかの理由でフレームが取得できない場合の最終保険
  }, { once:true });
}

/* ========================= 文章内の簡易装飾 ========================= */
/*
  desc / process1 / process2 のテキスト内で使える簡単な記法:
    **文章**          → 太字
    ==文章==          → マーカー(既定色)
    ==色:文章==       → マーカー(色指定。例: ==#5AA9E6:ここが大事==)
    __文章__          → アンダーライン(既定色)
    __色:文章__       → アンダーライン(色指定。例: __coral:ここに注目__)
  色は #RRGGBB のようなHEXでも、coral のような色名でも指定できます
*/
function escapeHTML(str){
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function parseInlineMarkup(str){
  if(!str) return '';
  let html = escapeHTML(str);
  html = html.replace(/==(?:([#A-Za-z0-9]+):)?(.+?)==/g, (m, color, text)=>
    `<span class="text-marker" style="background-color:${color || '#FFD166'}">${text}</span>`);
  html = html.replace(/__(?:([#A-Za-z0-9]+):)?(.+?)__/g, (m, color, text)=>
    `<span class="text-underline" style="text-decoration-color:${color || '#FF6F59'}">${text}</span>`);
  html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  return html;
}

function renderMediaCards(containerId, mediaList, d, forceFallbackCard){
  const group = document.getElementById(containerId);
  group.innerHTML = '';
  if(mediaList.length === 0){
    if(forceFallbackCard) mediaList = [null];
    else return;
  }

  const rotations = [3, -4, 2.5, -2, 4, -3];

  mediaList.forEach((rawItem, i)=>{
    /* media の各項目は、文字列だけでも { url, size:'main'|'sub' } のオブジェクトでもOK。
       size を省略した場合は 'main'(大)として扱う */
    const item = (rawItem && typeof rawItem === 'object') ? rawItem : { url: rawItem, size: 'main' };
    const path = item.url;
    const size = (item.size === 'sub') ? 'sub' : 'main';

    const card = document.createElement('div');
    card.className = `panel-media size-${size}`;
    card.style.transform = `rotate(${rotations[i % rotations.length]}deg)`;

    const inner = document.createElement('div');
    inner.className = 'panel-media-inner';
    inner.style.background = '#'+d.color.toString(16).padStart(6,'0');
    card.appendChild(inner);
    group.appendChild(card);

    const showFallback = ()=>{
      inner.innerHTML = `<div class="panel-media-fallback">
        <strong>画像/映像が見つかりません</strong>
        <span>${path || '(mediaが未設定です)'}</span>
      </div>`;
    };

    if(!path){ showFallback(); return; }

    const yt = parseYouTube(path);
    if(yt){
      /* YouTube: プレビューはサムネイル画像だけ(ページ表示時に重いiframeを読み込まない)。
         クリックすると全画面表示のなかで埋め込みプレイヤーが開く */
      const thumb = document.createElement('img');
      thumb.alt = d.title;
      let triedFallback = false;
      thumb.addEventListener('error', ()=>{
        if(!triedFallback){ triedFallback = true; thumb.src = `https://i.ytimg.com/vi/${yt.id}/mqdefault.jpg`; }
        else showFallback();
      });
      thumb.src = `https://i.ytimg.com/vi/${yt.id}/maxresdefault.jpg`;
      thumb.addEventListener('click', ()=> openLightbox('youtube', path, d.title));
      inner.appendChild(thumb);

      const playIcon = document.createElement('div');
      playIcon.className = 'media-play-icon';
      playIcon.title = '全画面表示して再生';
      playIcon.textContent = '▶';
      playIcon.addEventListener('click', (e)=>{
        e.stopPropagation();
        openLightbox('youtube', path, d.title);
      });
      inner.appendChild(playIcon);
    } else if(isVideoFile(path)){
      const v = document.createElement('video');
      v.src = path;
      v.playsInline = true;
      v.setAttribute('playsinline', '');
      v.setAttribute('webkit-playsinline', ''); // 古いiOS Safari向け
      v.muted = true;
      v.preload = 'metadata';
      v.className = 'media-preview-video'; /* controlsなし・操作不可のプレビュー専用 */
      v.addEventListener('error', showFallback, { once:true });
      preparePreviewThumbnail(v);
      inner.appendChild(v);

      const playIcon = document.createElement('div');
      playIcon.className = 'media-play-icon';
      playIcon.title = '全画面表示して再生';
      playIcon.textContent = '▶';
      playIcon.addEventListener('click', (e)=>{
        e.stopPropagation();
        openLightbox('video', path, d.title);
      });
      inner.appendChild(playIcon);
    } else {
      const img = document.createElement('img');
      img.alt = d.title;
      img.addEventListener('error', showFallback, { once:true });
      img.src = path;
      img.addEventListener('click', ()=> openLightbox('image', path, d.title));
      inner.appendChild(img);
    }

    /* caption が指定されていれば、写真下の白い余白に説明文を表示する */
    if(item.caption){
      const cap = document.createElement('div');
      cap.className = 'panel-media-caption';
      cap.textContent = item.caption;
      card.appendChild(cap);
    }
  });
}

function renderPanelMedia(d){
  /* media は文字列1つでも、配列で複数枚指定してもOK */
  const mediaList = Array.isArray(d.media) ? d.media : (d.media ? [d.media] : []);
  renderMediaCards('panel-media-group', mediaList, d, true);
}

/* 作品タイトル部分に1800×1080の画像を表示する。
   titleImage が指定されていない、または読み込みに失敗した場合は
   従来通りテキストのタイトルを表示する(画像を用意していない作品でも壊れない) */
function renderTitleImage(d){
  const img = document.getElementById('panel-title-image');
  const titleText = document.getElementById('panel-title');

  img.classList.remove('show');
  titleText.classList.remove('hide-for-image');
  img.removeAttribute('src');

  if(!d.titleImage) return;

  img.onload = ()=>{
    img.classList.add('show');
    titleText.classList.add('hide-for-image');
  };
  img.onerror = ()=>{
    img.classList.remove('show');
    titleText.classList.remove('hide-for-image');
  };
  img.alt = d.title;
  img.src = d.titleImage;
}

function renderLinks(containerId, links){
  const el = document.getElementById(containerId);
  if(!el) return;
  el.innerHTML = '';
  if(!links || links.length === 0) return;
  links.forEach(link=>{
    const a = document.createElement('a');
    a.className = 'panel-link';
    a.href = link.url;
    a.target = '_blank';
    a.rel = 'noopener noreferrer';
    a.textContent = link.label || link.url;
    const arrow = document.createElement('span');
    arrow.className = 'panel-link-arrow';
    arrow.textContent = '↗';
    a.appendChild(arrow);
    el.appendChild(a);
  });
}

function renderProcessSide(d){
  document.getElementById('panel-back-title').textContent = d.title;

  const hasProcess1 = !!(d.process1 && String(d.process1).trim());
  const hasProcess2 = !!(d.process2 && String(d.process2).trim());

  const section1 = document.getElementById('panel-process-section-1');
  const section2 = document.getElementById('panel-process-section-2');

  section1.style.display = hasProcess1 ? '' : 'none';
  if(hasProcess1){
    document.getElementById('panel-process-heading-1').textContent = d.process1Heading || '① きっかけ・動機';
    document.getElementById('panel-process-text-1').innerHTML = parseInlineMarkup(d.process1);
  }

  section2.style.display = hasProcess2 ? '' : 'none';
  if(hasProcess2){
    document.getElementById('panel-process-heading-2').textContent = d.process2Heading || '② 制作の過程';
    document.getElementById('panel-process-text-2').innerHTML = parseInlineMarkup(d.process2);
  }

  /* 写真/映像は、2つのセクションの「余ったスペース」に半分ずつ振り分ける */
  const processMediaList = Array.isArray(d.processMedia) ? d.processMedia : (d.processMedia ? [d.processMedia] : []);
  const half = Math.ceil(processMediaList.length / 2);
  renderMediaCards('panel-process-media-1', processMediaList.slice(0, half), d, false);
  renderMediaCards('panel-process-media-2', processMediaList.slice(half), d, false);

  renderLinks('panel-process-links', d.processLinks);

  /* 表(process1)・裏(process2)どちらにも記載がない場合は、裏返すボタンごと表示しない */
  const flipBtn = document.getElementById('flip-to-back-btn');
  flipBtn.style.display = (hasProcess1 || hasProcess2) ? '' : 'none';
}

const panelFront = panel.querySelector('.panel-front');
const panelBack = panel.querySelector('.panel-back');

function setActiveFace(showBack){
  /* SafariはCSSのbackface-visibilityだけでは信用できないため、
     JSでも明示的にvisibility/pointer-eventsを切り替えて確実に隠す */
  if(showBack){
    panelBack.classList.remove('face-inactive');
    panelFront.classList.add('face-inactive');
  } else {
    panelFront.classList.remove('face-inactive');
    panelBack.classList.add('face-inactive');
  }
}

function openPanel(id){
  const d = projectsData.find(x=>x.id===id);
  if(!d) return;
  panel.classList.remove('flipped');
  setActiveFace(false);
  renderPanelMedia(d);
  renderProcessSide(d);
  document.getElementById('panel-meta').textContent = `${d.category} · ${d.year}`;
  document.getElementById('panel-title').textContent = d.title;
  renderTitleImage(d);
  document.getElementById('panel-desc').innerHTML = parseInlineMarkup(d.desc);
  const tagsEl = document.getElementById('panel-tags');
  tagsEl.innerHTML='';
  d.tags.forEach(t=>{ const s=document.createElement('span'); s.className='tag'; s.textContent=t; tagsEl.appendChild(s); });
  renderLinks('panel-links', d.links);
  document.getElementById('panel-credit').textContent = d.credit || '';
  panel.classList.add('open');
  backdrop.classList.add('show');
}
function closePanel(){
  panel.classList.remove('open');
  panel.classList.remove('flipped');
  setActiveFace(false);
  backdrop.classList.remove('show');
  const v = panel.querySelector('video');
  if(v) v.pause();
  closeLightbox();
}
document.getElementById('panel-close').addEventListener('click', closePanel);
backdrop.addEventListener('click', closePanel);

/* 表/裏どちらの矢印ボタンでも同じトグル処理を使う。
   回転アニメーション(.8s)のちょうど真ん中で、写真風の資料を一瞬だけ非表示にし、
   同時にどちらの面がアクティブかもJS側で明示的に切り替える
   (Safariではbackface-visibilityだけに頼るとちらつきや、
    非表示のはずの面のボタンが残ってしまうことがあるための対策) */
document.querySelectorAll('.flip-arrow-btn').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    const willShowBack = !panel.classList.contains('flipped');
    document.querySelectorAll('.panel-media-group').forEach(el=> el.classList.add('media-hidden'));
    panel.classList.toggle('flipped');
    setTimeout(()=>{
      setActiveFace(willShowBack);
      document.querySelectorAll('.panel-media-group').forEach(el=> el.classList.remove('media-hidden'));
    }, 400);
  });
});

/* ========================= LIGHTBOX (写真/映像の全画面表示) ========================= */
const lightbox = document.getElementById('lightbox');
const lightboxContent = document.getElementById('lightbox-content');

function openLightbox(type, src, title){
  lightboxContent.innerHTML = '';
  if(type === 'youtube'){
    const yt = parseYouTube(src);
    if(yt){
      const f = document.createElement('iframe');
      const params = new URLSearchParams({ autoplay:'1', rel:'0', playsinline:'1' });
      if(yt.start) params.set('start', yt.start);
      f.src = `https://www.youtube.com/embed/${yt.id}?${params}`;
      f.title = title || 'YouTube video';
      f.allow = 'autoplay; encrypted-media; picture-in-picture; fullscreen';
      f.allowFullscreen = true;
      f.referrerPolicy = 'strict-origin-when-cross-origin';
      lightboxContent.appendChild(f);
    }
  } else if(type === 'video'){
    const v = document.createElement('video');
    v.src = src;
    v.controls = true;
    v.autoplay = true;
    v.playsInline = true;
    lightboxContent.appendChild(v);
  } else {
    const img = document.createElement('img');
    img.src = src;
    img.alt = title || '';
    lightboxContent.appendChild(img);
  }
  lightbox.classList.add('open');
}
function closeLightbox(){
  lightbox.classList.remove('open');
  const v = lightboxContent.querySelector('video');
  if(v) v.pause();
  lightboxContent.innerHTML = '';
}
document.getElementById('lightbox-close').addEventListener('click', closeLightbox);
lightbox.addEventListener('click', (e)=>{ if(e.target === lightbox) closeLightbox(); });

window.addEventListener('keydown', e=>{
  if(e.key !== 'Escape') return;
  if(lightbox.classList.contains('open')) closeLightbox();
  else closePanel();
});


/* オンボーディングのヒントは、シーンが表示されてから数秒後に消す(revealScene内で起動) */

/* ========================= RESIZE ========================= */
window.addEventListener('resize', ()=>{
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  if(!sceneRevealed) setIntroClip(Math.hypot(window.innerWidth, window.innerHeight) * 0.6);
});

/* ========================= ANIMATE ========================= */
const clock = new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();

  updateDayNightCycle(t);
  updateMoveAnimations();

  if(entryAnimations.length){
    const now = performance.now();
    entryAnimations.forEach(item=>{
      if(item.done) return;
      const elapsed = (now - entranceStartTime)/1000 - item.delay;
      if(elapsed <= 0) return;
      const p = Math.min(elapsed/item.duration, 1);
      item.group.position.y = item.restY + item.dropHeight*(1-easeOutBounce(p));
      const sp = Math.min(elapsed/(item.duration*0.5), 1);
      const s = Math.max(0.001, easeOutBack(sp));
      item.group.scale.set(item.restScale.x*s, item.restScale.y*s, item.restScale.z*s);
      if(p>=1){
        item.group.position.y = item.restY;
        item.group.scale.copy(item.restScale);
        item.done = true;
        entranceCompletedIds.add(item.pid);
      }
    });
    if(entryAnimations.every(it=>it.done)) entryAnimations.length = 0;
  }

  animatedItems.forEach(g=>{
    if(g.userData.spin) g.rotation.x = t*0.6;
    if(g.userData.hover && entranceCompletedIds.has(g.userData.pid)){
      const base = restYById[g.userData.pid] ?? 0;
      g.position.y = base + Math.sin(t*1.4)*0.05;
    }
  });
  if(autoRotate){
    theta += 0.0009 * autoRotateDir;
    if(theta >= THETA_MAX){ theta = THETA_MAX; autoRotateDir = -1; }
    else if(theta <= THETA_MIN){ theta = THETA_MIN; autoRotateDir = 1; }
    updateCamera();
  }
  renderer.render(scene, camera);
}
animate();
